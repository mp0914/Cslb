{q:"A quality brush stored after cleaning should be:",opts:["Left soaking in solvent between jobs", "Tossed loose in a drawer to dry", "Combed out and kept in its keeper", "Stored bristle-up in a bucket"],ans:2,exp:"Brush keepers (the cardboard sleeves brushes come in) protect bristle shape. Hang bristle-down or lay flat. Bristle-up storage lets paint settle into the ferrule and ruins the brush over time."},
{q:"A roller cover stored mid-job for the next day's continued use should be:",opts:["Thrown out and replaced every day", "Left out in the open air to dry overnight", "Wrapped tightly in plastic, still loaded", "Left lying in the paint tray overnight"],ans:2,exp:"Wrap the loaded cover tightly in plastic and store overnight. Saves cleanup time and the paint stays usable. Refrigerator works for longer storage. Same trick for brushes mid-job."},
{q:"A 1/2\" nap roller is generally suited for:",opts:["Brick and split-face block only", "Heavy, deep-texture stucco", "Smooth metal doors, cabinets, and fine trim", "Light texture and semi-smooth walls"],ans:3,exp:"1/2\" nap is the in-between size. Holds more paint than 3/8\", reaches into light texture. Common for textured drywall, knockdown, and most exterior wood siding."},
{q:"When painting trim on top of an already-painted wall, the painter should:",opts:["Usually walls first, then the trim", "Trim first, then the walls, every time", "Paint walls and trim at the same time", "Paint one and skip the other to save time"],ans:0,exp:"Most painters do walls first, then trim — easier to cut in trim sharp against finished wall than vice versa. Some specs reverse this. Either way, sequence matters and should be planned."},
{q:"A roller cover that sheds lint:",opts:["Is fine once the first coat is on", "Improves the more it's used and washed out between jobs", "Is low quality and will leave lint in the finish", "Should be sprayed with starch first"],ans:2,exp:"Cheap covers shed fibers into the wet paint, leaving lint stuck in the finish. Worth paying $8 for a quality cover vs $2 for a problem. Pre-tape the cover to remove loose lint before first use."},
{q:"Cutting in with a brush is generally faster than:",opts:["Rolling the open field of the wall", "Spraying a large, empty room with airless", "Masking with tape, then rolling", "Using a power roller on open walls"],ans:2,exp:"Skilled painters cut in faster than they can tape. Tape also pulls off paint when removed and lets paint bleed underneath. Practice freehand cutting in — it's a core trade skill."},
{q:"A pad applicator is BEST used for:",opts:["Detailed trim and molding", "Popcorn ceiling texture", "Heavy, rough stucco walls", "Staining decks and fences"],ans:3,exp:"Pad applicators excel at deck staining — flat fibers wipe stain into the wood evenly. Some painters use them for cutting in or fine trim. Not for textured surfaces."},
{q:"A texture (popcorn) gun applies:",opts:["Deck stain under low pressure", "Smooth finish paint on walls", "Clear sealer on garage and basement floors", "Texture like popcorn or knockdown"],ans:3,exp:"Hopper gun + compressed air creates texture patterns. Adjustable nozzle controls droplet size. Used for new construction and patches. Don't confuse with paint spray equipment."},
{q:"When repainting a previously textured ceiling, the painter must consider:",opts:["Matching the sheen of the old paint", "The color the owner wants to match", "Possible asbestos and lead in older ceilings", "Which brand of ceiling paint covers best over texture"],ans:2,exp:"Pre-1978 popcorn ceilings frequently contain asbestos AND may have lead paint. Test before disturbing. Asbestos abatement is its own license classification (C-22) — painters typically don't disturb asbestos."},
{q:"Cleaning latex paint from a brush should be done with:",opts:["Mineral spirits, then a water rinse", "Lacquer thinner and a brush comb", "Diluted bleach and warm water", "Warm water and dish soap"],ans:3,exp:"Latex = water cleanup. Warm water + dish soap, work through bristles, comb out, repeat until clear. Final shake-out, hang to dry. Solvents will damage synthetic bristles."},
{q:"Cleaning an alkyd (oil) brush requires:",opts:["Diluted bleach and warm water", "Mineral spirits, then soap and water", "White vinegar and hot water", "Warm water and dish soap, worked through the bristles"],ans:1,exp:"Mineral spirits dissolve alkyd. Work through bristles, repeat with clean spirits until clear. Then soap and water removes residual solvent and conditions natural bristles."},
{q:"A paint pail with a magnetic brush rest:",opts:["Is a luxury with no real practical benefit", "Bends and damages the brush ferrule", "Holds the brush up and cuts down on drips", "Is required by Cal/OSHA on all jobs"],ans:2,exp:"Magnetic rests grip the brush ferrule, holding the brush over the paint between strokes. Less mess, less waste, faster work. Worth the $20."},
{q:"Rolling ceilings is typically done with an extension pole because:",opts:["It keeps the painter off the ladder", "It looks more professional to clients", "It puts more paint on each stroke", "Building code requires it for ceilings"],ans:0,exp:"Extension poles save ladder moves and reduce arm fatigue. Standard practice for ceilings and high walls. Look for adjustable telescoping poles with locking ferrules."},
{q:"When painting a freshly primed surface, the painter should:",opts:["Topcoat within the primer's recoat window", "Wait 24 hours no matter the product", "Topcoat right away without checking", "Wait a full week so the primer can cure completely"],ans:0,exp:"Recoat windows vary by product. Some allow recoat in 1 hour; others require 4 hours. Check the technical data sheet. Too soon = lifting. Too late = adhesion issue."},
{q:"A roller pan or 5-gallon screen is used to:",opts:["Load the roller cover evenly", "Hold the paint can steady while rolling", "Clean roller covers at the end of the day", "Mix two paints together"],ans:0,exp:"Pans and screens evenly load the cover before each application. 5-gallon screens are faster for large jobs — paint stays in the bucket, no transferring. Pans suit smaller rooms and trim work."},
{q:"When the roller cover is fully loaded with paint, the painter should:",opts:["Roll it on the screen to spread the paint", "Dip it again so it holds more paint", "Slap it on the wall to release paint", "Let it drip over the bucket for a minute"],ans:0,exp:"Roll the loaded cover on the screen/pan first to redistribute paint and remove drips. Going straight to the wall with a fully loaded cover causes runs and uneven application."},
{q:"A common mistake when rolling walls is:",opts:["Rolling into cut-in that has already dried", "Loading the roller from a 5-gallon screen", "Rolling the ceiling before the walls", "Laying off in one direction at the end"],ans:0,exp:"The most common rolling mistake. Solution: cut in one section at a time and roll into the wet cut-in immediately. Or have a helper cut in just ahead of the roller."},
{q:"The 'lay-off' technique with a roller refers to:",opts:["Cleaning the roller at the end of the day", "Swapping in a fresh roller cover", "Stopping work at a natural break line", "Final light strokes in one direction"],ans:3,exp:"Lay off = light, finishing strokes in one direction after the W pattern and fill-in. Removes roller texture variation, leaves a uniform stipple. Standard for quality wall finishes."}
],
wallcoverings:[
{q:"Which wallcovering type is the most durable and fully washable, making it the usual choice for kitchens, baths, and commercial corridors?",opts:["Coated paper", "Solid vinyl", "Grasscloth", "Flocked paper"],ans:1,exp:"Solid vinyl is the most durable and fully washable option, which is why it dominates high-traffic and moisture-prone areas."},
{q:"A designer specifies grasscloth for an accent wall. What must you tell the customer before starting?",opts:["It can be scrubbed clean like vinyl", "Seams will show and the pattern won't match", "It goes up with no wall preparation at all", "It is the most stain-resistant option available"],ans:1,exp:"Grasscloth is a natural fiber with no repeating pattern, so seams always show and no pattern match is possible. Setting that expectation up front avoids a callback."},
{q:"Which wallcovering shows every imperfection in the wall behind it and normally requires a liner?",opts:["Fabric-backed vinyl","Vinyl-coated paper","Foil or mylar","Non-woven"],ans:2,exp:"Reflective foil and mylar telegraph every flaw beneath them. They demand near-perfect wall prep and are usually hung over liner paper."},
{q:"What is the commercial weight classification most commonly specified for offices, corridors, and hospitality?",opts:["Type I","Type II","Type III","Type IV"],ans:1,exp:"Type II is medium duty and is the standard commercial specification. Type I is light duty for ceilings and low traffic; Type III is heavy duty for high-abuse areas."},
{q:"Which wallcovering is dimensionally stable, does not expand when wet, and is typically hung paste-the-wall?",opts:["Traditional paper","Non-woven","Solid vinyl","Grasscloth"],ans:1,exp:"Non-woven material does not expand, so it needs no booking and the adhesive goes on the wall instead of the goods."},
{q:"Before cutting any wallcovering, what should you verify across all the bolts?",opts:["That they are all the same run or lot number", "That the price on each bolt matches the estimate", "That the rolls are the same weight", "That the backing is the same color"],ans:0,exp:"Bolts from different run or lot numbers can differ noticeably in shade. Verifying run numbers before cutting prevents visible color shifts across a wall."},
{q:"What does the pattern repeat measurement tell you?",opts:["How wide each strip is once trimmed", "How far down before the design starts over", "How long the adhesive takes to set", "How long each pasted strip should book"],ans:1,exp:"The repeat is the vertical distance before the pattern begins again. A longer repeat means more waste and higher material cost, so it directly affects the estimate."},
{q:"A wallcovering is described as peelable. What does that mean at removal time?",opts:["The entire covering pulls off dry with nothing left behind", "The face peels off dry; the backing stays on", "It cannot be removed without a steamer", "It must be painted over rather than removed"],ans:1,exp:"Peelable means the face layer comes off dry but the backing stays and must then be soaked and removed. Strippable is the type that comes off completely dry."},
{q:"What is the primary reason a wallcovering primer must be applied to bare drywall before hanging?",opts:["It makes the wallcovering's color look brighter and richer", "It speeds up the adhesive set time", "Removal later would tear the drywall's paper face", "Building code requires it in all rooms"],ans:2,exp:"Without primer the adhesive bonds directly to the drywall paper face. Removing the covering later then tears that paper off and destroys the wall."},
{q:"Besides sealing the surface, what else does wallcovering primer or sizing provide during hanging?",opts:["Slip, so strips can be slid into position", "Extra insulation value for the wall", "A vapor barrier behind the covering", "Added flame resistance for the room"],ans:0,exp:"Sizing gives the surface slip so a strip can be positioned rather than grabbing on contact, and it evens out porosity so the adhesive sets uniformly."},
{q:"Why should wallcovering never be hung over fresh, unprimed joint compound?",opts:["The compound is too smooth for the adhesive to grab", "The compound is far more porous than the wall", "The compound is chemically incompatible with vinyl", "It voids the drywall manufacturer's warranty"],ans:1,exp:"Unprimed joint compound absorbs adhesive much faster than the surrounding painted wall, causing uneven set, blisters, and loss of adhesion at those spots."},
{q:"You find mildew on a wall scheduled for wallcovering. What must happen?",opts:["Hang a mildew-resistant vinyl directly over it", "Kill it and fix the moisture source first", "Prime over it with two coats of sealer", "Wipe it off with a dry cloth and hang"],ans:1,exp:"Mildew grows straight through new covering. The growth must be killed and removed and the underlying moisture source corrected before anything is hung."},
{q:"How is liner paper hung, and why?",opts:["Vertically, so seams align with the finish seams", "Horizontally, so its seams cross the finish seams", "Diagonally, to add strength to the wall", "In small overlapping squares, like tile"],ans:1,exp:"Liner is hung horizontally so that its seams cross the vertical finish seams rather than stacking beneath them, which would telegraph through."},
{q:"Why should the first strip of wallcovering be hung to a struck plumb line rather than to a corner?",opts:["Corners are rarely truly plumb","Plumb lines are required by code","It reduces adhesive consumption","Corners collect more dust"],ans:0,exp:"Walls, corners, and ceilings are seldom plumb or level. Starting from a struck plumb line keeps the pattern true instead of drifting across the room."},
{q:"What is booking?",opts:["Recording each strip's position on a layout plan", "Folding a pasted strip on itself to let it relax", "Ordering extra bolts to allow for waste", "Rolling the seams flat right after hanging"],ans:1,exp:"Booking means folding the pasted strip paste-to-paste, without creasing, so the adhesive absorbs and the material finishes expanding before it goes on the wall."},
{q:"A wallcovering job shows open, gapping seams a few days after hanging. What is the most likely cause?",opts:["The adhesive was applied too heavily along the edges", "Strips weren't booked long enough or evenly", "The room was too humid while hanging", "The seams were rolled too firmly"],ans:1,exp:"Insufficient or uneven booking means the material expands on the wall and then shrinks back as it dries, pulling the seams open."},
{q:"What is the typical booking time for most pasted wallcoverings?",opts:["About 30 to 60 seconds", "About 3 to 10 minutes", "About 30 to 45 minutes", "About 2 to 3 hours"],ans:1,exp:"Most goods book for roughly 3 to 10 minutes, but the manufacturer's stated time governs and is the correct answer whenever it is offered as a choice."},
{q:"Which pattern match produces the most waste?",opts:["Random match with no repeat", "Straight match", "Half-drop match", "Free match"],ans:2,exp:"A half-drop match shifts the design partway down on each successive strip and repeats only every third strip, which drives the highest waste factor."},
{q:"In a straight match pattern, how does the design align between strips?",opts:["It meets at the same height on every strip", "It drops half a repeat on each new strip", "It needs no alignment from strip to strip", "It alternates direction on every other strip"],ans:0,exp:"A straight match means the pattern meets at the same height on every strip, making it simpler to hang and less wasteful than a drop match."},
{q:"What is the standard seam used for most wallcovering installations?",opts:["Overlap seam","Butt seam","Wire seam","Lap-and-tear seam"],ans:1,exp:"A butt seam brings the edges together with no gap and no overlap. It is the standard for most installations."},
{q:"In which direction should a strip be smoothed after it is placed on the wall?",opts:["From the bottom upward","From the center outward","From the edges toward the center","From the top down one edge only"],ans:1,exp:"Smoothing from the center outward drives trapped air and excess adhesive toward the edges where it can escape, rather than trapping it in the middle."},
{q:"Which wallcovering should NOT have its seams rolled?",opts:["Solid vinyl", "Vinyl-coated paper", "Flocked or embossed", "Non-woven fabric-backed"],ans:2,exp:"Rolling a flocked or embossed covering crushes the raised texture and squeezes adhesive out through the seam. Those goods are smoothed but never rolled."},
{q:"How should wallcovering be handled at an inside corner?",opts:["Wrap a full strip around the corner without cutting", "Cut it, wrap a little, and restart on a new plumb line", "Butt the strip exactly into the corner and stop", "Overlap two full strips by six inches at the corner"],ans:1,exp:"Corners are rarely plumb, so wrapping a full strip causes wrinkling and pattern drift. Cutting and restarting on a new plumb line keeps the run true."},
{q:"Why are solid vinyls and grasscloth often reverse hung?",opts:["To make the pattern match correctly", "So edge-to-edge shading doesn't build up", "To use less adhesive per strip", "Because the adhesive only works in one direction"],ans:1,exp:"Reverse hanging alternates every other strip end for end, so subtle shading variation from one edge of the roll to the other does not stack up across the wall."},
{q:"What is the kill point in a wallcovering installation?",opts:["The spot where the adhesive stops working","The point where the final strip meets the first","The maximum height the covering can reach","The place where the pattern repeat begins"],ans:1,exp:"The last strip almost never matches the first, so that meeting point should be planned into an inconspicuous spot such as behind a door or in a corner."},
{q:"A small bubble appears in freshly hung wallcovering. What is the correct response?",opts:["Strip and rehang the whole strip right away", "Slit and inject it, or wait for it to dry out", "Press it flat with a heat gun on its low setting", "Glue a cut patch over the bubble"],ans:1,exp:"Many small bubbles are moisture and vanish as the covering dries. A genuine dry spot is slit, injected with adhesive, and rolled flat."},
{q:"After removing old wallcovering, what step is most often skipped and causes later paint failure?",opts:["Sanding the entire wall to bare drywall","Washing off all residual adhesive","Applying two coats of texture","Replacing the drywall corner bead"],ans:1,exp:"Old adhesive residue is invisible when dry but re-wets under new coatings, causing bubbling, streaking, and adhesion failure. The wall must be washed and rinsed before priming."},
{q:"When scoring wallcovering before wet removal, what is the risk of pressing too hard?",opts:["The scoring tool will dull","You gouge the drywall beneath","The adhesive becomes waterproof","The pattern becomes impossible to match"],ans:1,exp:"A scoring tool is meant to perforate the covering so liquid can reach the adhesive. Excess pressure cuts into the drywall and creates repair work."},
{q:"What is a key safety consideration during wet wallcovering removal?",opts:["Most adhesive removers are highly flammable", "Water is being used near outlets and switches", "The steam will damage the ceiling", "Old wallcovering dust is a known carcinogen"],ans:1,exp:"Wet removal puts water near outlets and switches. Protect or de-energize them, and protect flooring, before soaking the walls."},
{q:"A building was constructed in 1965 and has painted walls beneath the wallcovering being removed. What additional requirement applies?",opts:["None beyond normal removal practice", "Lead-safe work practices", "A structural engineer's approval", "Recycling the old wallcovering"],ans:1,exp:"Pre-1978 buildings may have lead-based paint. Scoring and scraping disturbs it, bringing lead-safe work practice requirements into play."},
{q:"Wallcovering strips show noticeably different shading from one strip to the next. What are the two likely causes?",opts:["The wrong adhesive and the wrong primer", "Mixed run numbers, or not reverse hanging", "Too much booking time and low humidity", "Rolling the seams and smoothing too hard"],ans:1,exp:"Shading differences come either from mixing run or lot numbers, or from failing to reverse hang goods that vary in shade across the roll width."},
{q:"Old marker and water stains begin bleeding through newly hung wallcovering. What is the fix?",opts:["Hang a second layer of wallcovering over it", "Remove it, seal the stains, and rehang", "Wipe the face down with a mild solvent", "Raise the room humidity so it dries slower"],ans:1,exp:"Stains migrate through both coatings and wallcovering. They must be sealed with a stain-blocking primer before anything is applied over them."},
{q:"Wallcovering edges are curling away from the wall along the seams. What is the most likely cause?",opts:["Too much adhesive squeezed out at the edges", "Starved edges or a porous, unsealed wall", "Rolling the seams too soon after hanging", "High humidity in the room while it dried"],ans:1,exp:"Curling edges mean the adhesive at the seam either was never applied fully to the edge or was drawn out by an unsealed, porous wall."},
{q:"A permanent gloss haze appears on the face of newly hung wallcovering. What caused it?",opts:["The wrong sheen of primer underneath", "Adhesive left on the face and allowed to dry", "Too much pressure with the smoothing brush", "Hanging it in strong, direct sunlight"],ans:1,exp:"Adhesive squeezed onto the face must be wiped off immediately with each strip. Once it dries it leaves a permanent glossy film that cannot be removed."},
],
safety_falls:[
{q:"California's workplace safety agency (Cal/OSHA) requires fall protection for construction workers at heights of:",opts:["10 feet", "6 feet", "30 feet", "4 feet"],ans:1,exp:"Cal/OSHA construction trigger is 6 feet \u2014 same as federal Occupational Safety and Health Administration (OSHA) construction. General industry trigger is 4 feet. Painting jobsites are construction. Don't pick the 4-foot answer."},
{q:"Fall protection options under California's workplace safety agency (Cal/OSHA) include:",opts:["Personal fall arrest systems, and nothing else", "Safety nets, but only on commercial jobs", "Hard hats and high-visibility vests", "Guardrails, harness systems, or safety nets"],ans:3,exp:"Multiple options exist: guardrails, personal fall arrest systems (PFAS), safety nets, and positioning devices. Guardrails are passive (no worker action needed) and preferred. PFAS, nets, and positioning devices are alternatives based on the situation."},
{q:"A scaffold's top guardrail must be installed at:",opts:["42 inches ±3\" above the platform", "36 inches above the platform", "60 inches above the platform", "30 inches above the platform"],ans:0,exp:"42\" ±3\" is the Cal/OSHA spec. Plus midrail (halfway between top rail and platform) and toeboard (4\" minimum). Memorize 42 inches — frequently tested."},
{q:"A scaffold's midrail must be:",opts:["At the same height as the top rail", "Optional once a top rail is in place and secured", "About halfway between top rail and platform", "Not required on painting scaffolds"],ans:2,exp:"Midrail required at ~21\" — halfway between top rail and platform. Prevents falls from beneath the top rail. Together with top rail and toeboard, forms the complete guardrail system."},
{q:"Scaffold toeboards must be at least:",opts:["Not required", "12 inches high", "4 inches high", "1 inch high"],ans:2,exp:"4\" toeboard required to prevent tools and materials from being kicked off the scaffold edge. Also catches sliding objects. Required on platforms above 10 feet on open sides."},
{q:"Guardrails are required on the open sides of scaffolds at heights above:",opts:["10 feet", "Not required at any height", "30 feet", "4 feet"],ans:0,exp:"California's workplace safety agency (Cal/OSHA) scaffold rule: guardrails on open sides above 10 feet. Below 10 feet, guardrails not required (though good practice). Don't confuse with the 6-foot fall protection trigger for other situations."},
{q:"An extension ladder's base should be set out from the wall using the:",opts:["1:1 rule", "4:1 rule (1 ft out for every 4 ft of rise)", "8:1 rule", "2:1 rule (1 ft out for every 2 ft of rise)"],ans:1,exp:"4:1 = base 1 foot out from wall for every 4 feet of vertical rise. A 16-foot working height = base 4 feet out. Too steep = ladder tips backward. Too shallow = slides out at base."},
{q:"An extension ladder used to access a roof or platform must extend above the landing by at least:",opts:["6 feet", "1 foot", "3 feet", "10 feet"],ans:2,exp:"3 feet above the landing gives the worker something to hold while transitioning on/off the ladder. California's workplace safety agency (Cal/OSHA) requirement. Tie off the top to prevent ladder slip."},
{q:"When climbing a ladder, the painter must maintain:",opts:["One hand and one foot", "Two hands at all times", "Three points of contact", "Two points of contact"],ans:2,exp:"Three points of contact at all times when climbing. Don't carry tools in your hands — use a tool belt or hoist. This is a fundamental ladder safety rule, frequently tested."},
{q:"Tools should be carried up a ladder by:",opts:["Tossing them up to a coworker first", "A tool belt or a hoist line", "Holding them in one free hand", "Hooking a bucket over one arm"],ans:1,exp:"Hands free for climbing = three points of contact. Tool belt for small tools, hoist line/bucket for larger items. Throwing tools is dangerous to anyone below and to the tools themselves."},
{q:"Step ladders should NEVER be used:",opts:["With the spreader bars fully locked in the open position", "On firm, level ground indoors", "Leaned against a wall like a straight ladder", "Indoors on a finished floor"],ans:2,exp:"Step ladders are designed for the A-frame position with spreader locked. Leaning them = base instability and tip-over. Also never stand on the top two rungs: the top is labeled 'Not a Step' and standing on it tips the ladder forward."},
{q:"A ladder placed near energized power lines (up to 50 kV) must be kept at a minimum distance of:",opts:["10 feet", "3 feet", "50 feet", "5 feet"],ans:0,exp:"10 feet minimum from energized lines up to 50kV. More for higher voltages. Metal ladders are conductive \u2014 fiberglass ladders are required for any electrical work. Painters paint near service lines often; respect the clearance."},
{q:"Metal ladders are dangerous near power lines because:",opts:["They conduct electricity", "They rust and weaken over time", "They are too tall to control", "They are too heavy to position"],ans:0,exp:"Aluminum ladders conduct electricity. Contact with energized lines = fatal shock. Use fiberglass or wood for any work near electrical service drops, transformers, or lines."},
{q:"A 'competent person' under California's workplace safety agency (Cal/OSHA) scaffold rules is:",opts:["Whoever the general contractor assigns that day", "Any worker on site wearing a hard hat", "Any worker with five or more years in the trade", "One who can spot hazards and is authorized to fix them"],ans:3,exp:"Cal/OSHA's exact definition: identifies hazards + authorized to fix them. Required for scaffold erection, dismantling, and daily inspection. Often a foreman with documented training."},
{q:"Scaffolds must be inspected:",opts:["Only when the scaffold is first erected", "Before each shift by a competent person", "Once a year by the scaffold supplier", "Only by a licensed outside engineer"],ans:1,exp:"Daily inspection by competent person. Plus reinspection after wind storms, vehicle impact, modifications. Document inspections — required for Cal/OSHA records."},
{q:"Scaffold platforms must be:",opts:["Planked only where workers will stand", "Fully planked, with no gaps to step through", "Made of plywood sheets and nothing else", "Built from metal decking, never wood"],ans:1,exp:"Full planking — no gaps wider than 1\" between planks (with limited exceptions around uprights). Workers must not be able to step through and fall."},
{q:"Scaffold planks must overlap supports by at least:",opts:["3 inches", "6 inches", "1 inch", "2 feet"],ans:1,exp:"6\" minimum overlap (12\" recommended). Less = plank can rotate or slip off. Plank ends must be cleated or extend to supports — never cantilever past a support."},
{q:"A rolling (mobile) scaffold being moved with a worker on the platform:",opts:["Prohibited; workers must get off first", "Allowed indoors on a smooth, level floor", "Allowed if the worker holds onto the rail", "Allowed if the scaffold is moved slowly"],ans:0,exp:"Riding a rolling scaffold = guaranteed tip-over. Prohibited by Cal/OSHA. Workers descend, scaffold is repositioned and locked, then workers climb back up."},
{q:"A rolling scaffold's wheels must be:",opts:["Made of solid steel, never rubber", "Locked when the scaffold is in use", "Removed once it is in position", "Greased every week to roll smoothly"],ans:1,exp:"Wheels locked = scaffold doesn't move. Unlocked wheels can roll from worker movement, vibration, or slope. Lock all four wheels every time work begins."},
{q:"A height-to-base ratio limit on rolling scaffolds without outriggers is approximately:",opts:["10:1 indoors, 8:1 outdoors", "Not regulated if wheels are locked", "4:1 indoors, 3:1 outdoors", "1:1 indoors and outdoors"],ans:2,exp:"Tall narrow scaffolds tip over. 4:1 indoors, 3:1 outdoors (where wind matters). Beyond ratio, install outriggers to widen the base."},
{q:"A personal fall arrest system (PFAS) consists of:",opts:["A safety net under the work area and a guardrail", "A body belt, lanyard, and anchor", "A full-body harness, lanyard, and anchor", "A hard hat and chin strap"],ans:2,exp:"Harness + lanyard + anchor = the three required components. Body belts are banned for fall arrest. Anchor must support 5,000 lbs per worker (or 2× max arresting force in engineered systems)."},
{q:"Body belts for fall arrest are:",opts:["Banned for fall arrest", "Required for all roof work", "Required above 50 feet only", "Equal to a full-body harness"],ans:0,exp:"Body belts cause internal injuries during fall arrest — concentrate force on the abdomen. Banned. Full-body harnesses distribute force across thighs, chest, shoulders. Critical safety distinction."},
{q:"A fall arrest anchor point must support:",opts:["No specific weight requirement", "The worker's body weight", "At least 5,000 lbs per worker", "At least 500 lbs per worker"],ans:2,exp:"5,000 lbs per worker is the Occupational Safety and Health Administration (OSHA) minimum. Engineered systems can use lower numbers if certified by qualified person. Doesn't sound like much but anchoring to drywall, gutters, vents = death traps."},
{q:"Maximum free fall in a personal fall arrest system is generally:",opts:["2 feet", "12 feet", "30 feet", "6 feet"],ans:3,exp:"6 feet maximum free fall with a standard shock-absorbing lanyard. Beyond that, deceleration forces exceed safe limits. Self-retracting lifelines reduce free fall to about 2 feet."},
{q:"Total fall clearance below the worker must be calculated to include:",opts:["Wind speed at the work height", "Lanyard length plus the worker's weight", "Anchor height, wind speed, and the worker's weight", "Lanyard, deceleration, stretch, and worker height"],ans:3,exp:"Fall clearance math: 6' lanyard + 3.5' deceleration + 1' harness stretch + 1' safety factor + ~6' worker height = ~17.5'. Below that, the worker hits the ground before the system arrests. Critical calculation."},
{q:"A worker who has experienced a fall and been arrested by their personal fall arrest system (PFAS):",opts:["Should be left hanging until they feel better", "Should drink water while waiting", "Should climb back and resume work", "Must be rescued promptly"],ans:3,exp:"Suspension trauma: hanging in a harness restricts blood flow, can cause cardiac arrest within 30 minutes. Rescue plan must be in place BEFORE work begins. Don't leave them hanging."},
{q:"A rescue plan for fall arrest situations is:",opts:["Provided by California's workplace safety agency (Cal/OSHA) on request", "Optional", "Required as part of the fall protection program", "The same as first aid"],ans:2,exp:"Occupational Safety and Health Administration (OSHA) requires a rescue plan. Rescue equipment must be on-site (rescue ladder, descent device, aerial lift). Calling 911 is NOT a rescue plan \u2014 too slow for suspension trauma."},
{q:"A safety harness must be inspected:",opts:["Before each use, and retired after a fall", "Only when it is due for recertification", "Once a year by the safety manager", "Only when it comes out of the package"],ans:0,exp:"Daily pre-use inspection: webbing for cuts/burns, hardware for damage, stitching for separation. Any harness that arrested a fall must be removed from service — internal damage may not be visible."},
{q:"A scaffold capacity rating is typically:",opts:["At least 100 lbs per platform", "Unlimited, if properly braced", "At least 4 times the intended load", "Equal to the intended load"],ans:2,exp:"Cal/OSHA requires the scaffold and its components to be rated at least 4× the maximum intended load (workers, tools, materials). Heavy materials (paint pallets, equipment) must factor into capacity. Don't overload."},
{q:"Scaffold base plates and mud sills are:",opts:["Optional if the ground looks firm", "Required to spread loads on soft ground", "Used only on metal scaffold frames", "Needed only on paved surfaces"],ans:1,exp:"Base plates spread the leg load; mud sills (large planks) further distribute on soft soil. Without them, scaffold legs sink and the platform tilts. Required for safe erection on most jobsites."},
{q:"A suspended scaffold (swing stage) requires workers to:",opts:["Tie off to a separate vertical lifeline", "Work alone so the stage isn't overloaded", "Use the stage's railing as fall protection", "Clip their lanyard to the stage's own cables"],ans:0,exp:"Suspended scaffolds can fail (rope/cable break, anchor failure, counterweight shift). Workers wear a personal fall arrest system (PFAS) attached to a SEPARATE lifeline — independent of the scaffold itself. Belt + suspenders approach."},
{q:"Counterweights on a suspended scaffold:",opts:["Are not required on short drops", "Can be sand bags or other removable heavy items", "Can be whatever heavy material is on site", "Must be approved fixed weights, never sand bags"],ans:3,exp:"Approved counterweights only — concrete blocks designed for the purpose, secured. Sand bags can spill or shift. Removable weights can be moved by anyone. Failures kill workers below."},
{q:"A ladder over 20 feet long should:",opts:["Be used only by experienced painters", "Be a Type IA, extra heavy duty", "Be a Type III, light duty", "Be a Type II, medium duty"],ans:1,exp:"Long ladders need higher duty ratings. Type IA = 300 lb capacity, industrial. Type I = 250 lb. Type II/III are lighter and inappropriate for commercial work."},
{q:"A ladder rung that shows visible damage should be:",opts:["Used carefully until the job is done", "Repaired on site with duct tape and a hose clamp", "Tagged 'Do Not Use' and removed from service", "Reinforced by wrapping it with rope"],ans:2,exp:"Damaged ladders kill people. Tag, remove, dispose. Don't try to field-repair structural damage. Cost of a new ladder vs. cost of a fall = no contest."},
{q:"A scaffold erected near vehicular traffic:",opts:["Is illegal on any public street", "Needs barricades and signage", "Must come down at the end of each day", "Requires no additional precautions"],ans:1,exp:"Vehicles can hit scaffolds. Barricades, cones, signage, possibly flaggers. Often requires permit from local traffic authority. Coordinate with general contractor on traffic control plan."},
{q:"When erecting or dismantling a scaffold, workers must be:",opts:["Trained and supervised by a competent person", "Allowed to skip fall protection while erecting", "Free to work however they wish", "Working alone so the frame isn't overloaded"],ans:0,exp:"Scaffold erection is when most scaffold accidents happen. Trained crew, competent person supervising, fall protection at heights, proper sequence. Cal/OSHA enforces this strictly."},
{q:"A wall bracket scaffold (pump jack):",opts:["Is regulated like other scaffolds", "Is used only together with ladders", "Has no rules because it's so low", "Is exempt from all scaffold rules"],ans:0,exp:"Pump jacks are regulated like other scaffolds, with specific Cal/OSHA requirements: pole spacing (max 10 ft), bracing, and fall protection at height. Common painter scaffold — but don't underestimate the rules."},
{q:"Scaffold materials damaged by impact, weather, or rust must be:",opts:["Used as-is until the job ends", "Inspected and pulled if compromised", "Reinforced with rope and kept in use", "Painted over to stop the rust"],ans:1,exp:"Damaged components reduce scaffold capacity unpredictably. Inspect, mark, and replace. Saving $200 in damaged components isn't worth a collapsed scaffold."},
{q:"A scaffold inspection log is:",opts:["Optional on jobs under one week", "Kept only after an accident occurs", "Often required, recording each inspection", "Filed once a year with the state"],ans:2,exp:"Documentation protects the contractor in case of incidents. Date, inspector name, findings, corrective actions. Some employers and project specs require formal inspection records."},
{q:"Personal fall protection equipment must be:",opts:["Sized to fit the person wearing it", "Sized one size larger for comfort", "Issued only to crew leaders", "Worn over a loose, heavy jacket"],ans:0,exp:"Harnesses come in sizes — too small or too large fails to distribute force properly during arrest. Fit and adjustment matter. Train workers on proper donning."},
{q:"A self-retracting lifeline (SRL):",opts:["Is the same as a regular shock lanyard", "Is a line that needs no anchor point", "Pays out and locks quickly on a fall", "Is a replacement for the full harness"],ans:2,exp:"SRLs lock on rapid extension (like a seatbelt). Free fall typically <2 feet vs 6 feet for shock-absorbing lanyard. Less fall clearance needed. Still requires harness and rated anchor."},
{q:"Working from a single ladder above 20 feet:",opts:["Requires no fall protection at all", "Calls for a scaffold or lift instead", "Is the most efficient way to work high", "Is always allowed with a spotter"],ans:1,exp:"High ladder work + extended hours + reaching = falls. Scaffolds and lifts are safer for sustained work. California's workplace safety agency (Cal/OSHA) may require alternatives in some situations."},
{q:"Aerial lifts (scissor lifts, boom lifts) require:",opts:["Training, daily inspection, and fall protection", "Use only by the contracting company's owner", "A state-issued operator's license only", "No training for lifts under 20 feet"],ans:0,exp:"Aerial lift training documented per Cal/OSHA. Daily pre-use inspection. Boom lifts: a personal fall arrest system (PFAS) tied to the basket, not an external anchor. Scissor lifts: fall protection from guardrails."},
{q:"When tied off in a boom lift, the painter:",opts:["Can sit on the rail to reach", "Must stay inside the basket", "Can unclip to reach farther", "Can climb out of the basket"],ans:1,exp:"A personal fall arrest system (PFAS) in a boom lift is anchored to the basket. Climbing out leaves the anchor with the basket — worker is unprotected. Stay inside, even if you can almost reach what you need."},
{q:"A 'near miss' incident on a jobsite (someone almost falls but doesn't):",opts:["Can be ignored since no one was hurt", "Means the safety system worked fine", "Should be reported and investigated", "Is only reported if someone asks"],ans:2,exp:"Near misses are warnings. Investigate root cause and fix it before someone actually gets hurt. Many serious accidents have multiple near-misses preceding them."}
],
safety_resp:[
{q:"A half-face P100 respirator filters particulates at:",opts:["95% efficiency", "99.97% efficiency", "100%, including all gases", "50% efficiency"],ans:1,exp:"P100 = 99.97% particulate filtration efficiency for particles ≥0.3 micron. Standard for lead dust, paint mist, silica. Does NOT filter gases or vapors — those need cartridges."},
{q:"The 'P' in P100 (a filter removing 99.97 percent of particles, oil resistant) stands for:",opts:["Powered", "Oil-Proof", "Plastic", "Particulate"],ans:1,exp:"National Institute for Occupational Safety and Health (NIOSH) 42 Code of Federal Regulations (CFR) 84: N=Not oil-resistant, R=Oil-Resistant, P=oil-Proof. P-rated filters work in any oily aerosol environment. Most paint spray situations use P100."},
{q:"The 'N' in an N95 respirator filter rating stands for:",opts:["Not oil resistant", "Nitrogen rated", "NIOSH approved", "Nuisance dust"],ans:0,exp:"N = Not oil-resistant. N95 filters degrade in oily atmospheres. For oil-based paints or spray work, use R or P rated filters instead."},
{q:"Spraying isocyanate-containing two-component urethane requires:",opts:["N95 (a filter removing 95 percent of non-oil particles) only", "Supplied-air respirator \u2014 isocyanate cartridges have no breakthrough indicator", "Half-face P100 (a filter removing 99.97 percent of particles, oil resistant) only", "No respirator if outdoors"],ans:1,exp:"Isocyanates are sensitizers \u2014 chronic exposure causes occupational asthma. air-purifying respirator (APR) cartridges have no end-of-service-life indicator for isocyanates, so you can't know when they've failed. Supplied air only."},
{q:"Below 19.5% oxygen, the required respiratory protection is:",opts:["Supplied air or a self-contained breathing unit", "No respirator, if the work is brief", "A half-face air-purifying respirator with fresh cartridges", "A P100 particulate filter cartridge"],ans:0,exp:"Air-purifying respirators (APRs) only filter ambient air — they don't supply oxygen. In oxygen-deficient atmospheres (<19.5%), workers need a supplied-air respirator or self-contained breathing apparatus (SCBA). Common in confined spaces."},
{q:"Respirator fit testing for tight-fitting facepieces is required:",opts:["Only when switching respirator brands", "Once, when the worker is first hired", "Annually and whenever facial features change", "Every five years at license renewal"],ans:2,exp:"Annual fit testing required per California's workplace safety agency (Cal/OSHA). Also when changing brands/models, after dental work, weight changes, or facial scarring. Documented record kept."},
{q:"Facial hair that crosses the respirator's seal area:",opts:["Doesn't matter with a good respirator", "Breaks the seal, so the area must be shaved", "Is fine as long as it's trimmed short", "Improves the fit by filling small gaps"],ans:1,exp:"Stubble or beards = leaks. Tight-fitting respirators only seal against clean-shaven skin. Powered air-purifying respirators (PAPRs) with hoods are an alternative for workers with beards."},
{q:"A user seal check (positive/negative pressure check) is performed:",opts:["Only by the company safety officer", "Once a year at fit testing", "Once at the start of each project", "Each time the respirator is donned"],ans:3,exp:"Every time the respirator goes on. Cover cartridges, inhale (negative pressure check) — facepiece should suck in. Exhale gently with valve covered (positive pressure check). Detects gross leaks."},
{q:"A written respiratory protection program is:",opts:["Optional for small contractors", "Required only for federal contractors", "Required whenever respirators are required", "The same thing as the company's general safety manual"],ans:2,exp:"California's workplace safety agency (Cal/OSHA) requires a written program if respirators are required. Includes 8 elements: selection, medical evaluation, fit testing, training, use, maintenance, breathing air, program evaluation."},
{q:"A medical evaluation for respirator users is:",opts:["The same as a general physical from any family doctor", "Optional for experienced painters", "Required before first use and fit testing", "Done once a year, after fit testing"],ans:2,exp:"Wearing a respirator is physiological work — adds breathing resistance and heat. California's workplace safety agency (Cal/OSHA) requires medical evaluation BEFORE first use. Cardiac, pulmonary, claustrophobia issues might disqualify."},
{q:"Cartridge change-out for a chemical cartridge respirator should be based on:",opts:["A set change schedule based on service life", "Whenever the worker feels like it", "When the worker can first smell the solvent vapor inside", "When the cartridge changes color"],ans:0,exp:"Most organic vapor cartridges have NO visual indicator. Change schedule based on use time, contaminant, humidity. Some products do have end-of-service-life indicators (ESLI) — read the manufacturer specs."},
{q:"Pre-1978 housing is presumed to contain lead-based paint UNLESS:",opts:["The home is located in a California coastal county", "The homeowner signs a statement saying so", "A certified lead test confirms otherwise", "The home was repainted after 1978"],ans:2,exp:"1978 was the federal ban on residential lead-based paint. Pre-1978 = assume lead until certified test proves otherwise. Test kits available; some require certified lab analysis."},
{q:"Environmental Protection Agency (EPA) lead-safe renovation rule applies to renovation, repair, and painting in pre-1978 housing where the work disturbs:",opts:["Over 6 sq ft inside or 20 sq ft outside", "Any amount of paint, however small", "Only exterior surfaces of the home", "Over 20 sq ft inside or 60 sq ft outside"],ans:0,exp:"Lead-safe renovation rule thresholds: 6 sq ft interior, 20 sq ft exterior, OR replacing windows in a child-occupied facility. Below thresholds, lead-safe renovation rules don't apply (best practice still uses safe methods)."},
{q:"A 'certified renovator' under Environmental Protection Agency (EPA) lead-safe renovation rule must:",opts:["Be at least 30 years old and licensed", "Be the owner of the home or building being worked on", "Complete EPA-approved training and stay certified", "Be a licensed professional engineer"],ans:2,exp:"Certified renovator = person who took the 8-hour EPA-approved training and holds current certification (renew every 5 years). Must be on-site for covered by the lead-safe rule work."},
{q:"A 'firm' performing lead-safe renovation work in pre-1978 housing must be:",opts:["Bonded, with no other requirement", "Licensed for commercial work only", "Self-certified by the owner", "EPA-certified as a renovation firm"],ans:3,exp:"The company itself is also certified. Renew every 5 years. Firm certification is separate from individual renovator certification — both required."},
{q:"Before starting lead-safe renovation work, the painter must:",opts:["Begin work without any notification", "Notify the city building department, but not the occupants", "Apply for a city building permit", "Hand out the EPA 'Renovate Right' pamphlet"],ans:3,exp:"Renovate Right pamphlet must be distributed before starting work. Get signed acknowledgment. Mandatory under federal lead-safe renovation rule. Failure = penalty per occurrence."},
{q:"Lead-safe renovation rule exterior containment requires plastic ground sheeting that extends approximately:",opts:["100 feet from the work area", "Containment is not required", "1 foot from the work area", "10 feet from the work area"],ans:3,exp:"10 feet minimum exterior containment to catch falling paint chips and dust. More for multi-story or windy work. Vertical containment may also be needed near high traffic or schools."},
{q:"During lead-safe renovation work, prohibited practices include:",opts:["Wet scraping, wet sanding, and HEPA vacuuming of debris", "Brushing and rolling paint by hand on trim", "Applying primer over sound, intact paint", "Open-flame burning and unrestricted power washing"],ans:3,exp:"Lead-safe renovation rule prohibitions: no open flame, no heat guns above 1100°F, no machine sanding without HEPA, no unrestricted power washing. These all aerosolize lead dust. Wet methods preferred."},
{q:"Lead-safe renovation rule cleanup requires:",opts:["Sweeping with a broom, then bagging debris", "Skipping cleanup when the work is outdoors", "HEPA vacuuming, wet wiping, and verification", "Blowing the area clean with compressed air"],ans:2,exp:"HEPA + wet wipe + cleaning verification. Sweep/compressed air aerosolize lead dust — prohibited. Cleanup is documented and verified before releasing the work area."},
{q:"Cleaning verification under lead-safe renovation rule is:",opts:["A cloth wipe test that must pass before release", "Done only by an outside testing lab", "The painter's visual check, nothing more", "Optional if the area looks clean to the homeowner"],ans:0,exp:"Wet/dry electrostatic cloth wipes of cleaned surfaces. Compare against a printed verification card. If too dirty, re-clean. Documents the work area is safe to release."},
{q:"Lead-safe renovation rule record retention is:",opts:["At least 3 years", "Not required at all", "At least 1 year", "At least 30 years"],ans:0,exp:"Lead-safe renovation rule records (training certs, signed pamphlet acknowledgment, work documentation, cleaning verification) must be retained at least 3 years. Environmental Protection Agency (EPA) can audit and demand records."},
{q:"California Department of Public Health licenses lead workers separately from Environmental Protection Agency (EPA) lead-safe renovation rule for:",opts:["Removing wallpaper from homes built before 1978", "Lead abatement, the deliberate removal of lead", "Cosmetic painting of any kind", "Replacing windows in older homes"],ans:1,exp:"Lead-safe renovation rule = renovation work that incidentally disturbs lead. Abatement = deliberate removal of lead hazards — stricter rules, separate California license. Different jobs, different licensure."},
{q:"Lead waste in California is:",opts:["Safe to rinse into storm drains", "Recyclable as ordinary scrap metal", "Regular construction waste that can go to any dump", "Hazardous waste, hauled by licensed haulers"],ans:3,exp:"California regulates lead waste more strictly than federal. All debris, dust, water, used personal protective equipment (PPE) from lead work = hazardous waste. Manifested disposal through licensed haulers."},
{q:"Crystalline silica exposure during sandblasting causes:",opts:["Mild irritation that clears up", "Silicosis, a permanent lung disease", "No known long-term health effects", "A skin rash and nothing more"],ans:1,exp:"Silicosis is incurable, progressive, and disabling. Silica is also a Group 1 human carcinogen. Occupational Safety and Health Administration (OSHA) has an aggressive silica standard. Wet methods and high-efficiency particulate air (HEPA) controls are required for silica-generating work."},
{q:"Occupational Safety and Health Administration’s (OSHA) permissible exposure limit (PEL) for respirable crystalline silica (8-hr TWA) is:",opts:["5,000 \u00b5g/m\u00b3", "No limit", "50 \u00b5g/m\u00b3", "500 \u00b5g/m\u00b3"],ans:2,exp:"OSHA PEL = 50 micrograms per cubic meter, 8-hour TWA (lowered from 100 in 2016). Action level = 25 \u00b5g/m\u00b3. Engineering controls and respiratory protection required to stay below."},
{q:"Engineering controls for silica include:",opts:["Blowing dust off with compressed air", "Wet methods and HEPA dust collection", "Dry hand brushing of the surface", "Ignoring the dust if work is outside"],ans:1,exp:"Hierarchy of controls: substitute abrasive (garnet, copper slag), wet methods, HEPA dust collection, isolation. Then personal protective equipment (PPE) if needed. Engineering controls preferred over PPE."},
{q:"A written silica exposure control plan is:",opts:["Required when silica exceeds the action level", "Optional for small painting firms", "Required only for new construction", "Available only if a worker asks for a copy of it in writing"],ans:0,exp:"Occupational Safety and Health Administration (OSHA) silica standard requires written exposure control plan. Identifies tasks, exposures, controls. Updated periodically. Trained competent person enforces."},
{q:"Solvent vapor accumulation in an enclosed space creates:",opts:["Only an appearance problem with the finish", "Slower drying, and nothing more", "No real hazard if the door is open", "Inhalation and fire or explosion hazards"],ans:3,exp:"Solvent vapors heavier than air pool at floor level. Inhalation = central nervous system depression, organ damage. Plus fire/explosion risk. Ventilate or stop work."},
{q:"Sources of ignition that must be controlled when solvents are in use include:",opts:["Pilot lights, sparks, static, and smoking", "Open flames, but not electrical sparks", "Direct sunlight on the paint cans", "Cell phones, but not static electricity"],ans:0,exp:"All ignition sources matter. Furnace pilot lights, light switches, drills, refrigerator compressors, static, cigarettes — any can ignite solvent vapors. Identify and shut off before painting."},
{q:"Solvent-soaked rags must be:",opts:["Kept in a covered metal container", "Thrown in a regular trash bag", "Burned on site at the end of the day", "Buried on site away from buildings"],ans:0,exp:"Linseed-oil and many solvent rags self-combust when piled — heat from oxidation has no escape. Covered metal container with self-closing lid (Underwriters Laboratories (UL)-listed safety can) is the standard."},
{q:"SDS (Safety Data Sheets) must be:",opts:["Readily accessible to workers handling the chemical", "Mailed to the homeowner", "Locked in the office", "Filed with California's workplace safety agency (Cal/OSHA) only"],ans:0,exp:"safety data sheet (SDS) = right-to-know. Workers using the chemical must be able to read the SDS during their shift. Binder on truck, electronic access on phones, etc. Easily accessible \u2014 not buried in headquarters (HQ)."},
{q:"safety data sheet (SDS) section that describes first aid is:",opts:["Section 16", "Section 1", "Section 4", "Section 8"],ans:2,exp:"Globally Harmonized System (GHS)-format SDS has 16 standardized sections. Section 4 = First-aid measures. Critical for emergencies. Train workers to find Section 4 quickly."},
{q:"safety data sheet (SDS) section that describes exposure controls and personal protective equipment (PPE) is:",opts:["Section 4", "Section 8", "Section 1", "Section 16"],ans:1,exp:"Section 8 = Exposure Controls/Personal Protection. Lists exposure limits and required PPE. Section 1 = identification (ID). Section 16 = other info."},
{q:"A confined space is:",opts:["A walk-in closet or pantry inside a home", "Any small room with a single door and no windows", "Any basement or crawl space below grade level", "Enterable, limited exits, not for continuous work"],ans:3,exp:"Three criteria: enterable, limited entry/exit, not designed for continuous occupancy. Tanks, vaults, manholes, large piping. Sound office space doesn't qualify even if small."},
{q:"A permit-required confined space adds:",opts:["No hazards beyond a normal confined space", "A serious hazard, such as a toxic atmosphere", "Smaller dimensions than a standard space", "Just extra paperwork for the employer"],ans:1,exp:"Permit-required confined space = confined space PLUS one of: hazardous atmosphere, engulfment risk, internal trap, or other serious hazard. Triggers full permit program."},
{q:"Confined space entry requires:",opts:["Air testing, ventilation, a permit, and an attendant", "A standard dust mask and a flashlight", "Holding your breath for short entries", "One person entering alone with no outside support or permit"],ans:0,exp:"Full program: test atmosphere before/during, ventilate, written permit, attendant outside in continuous communication, rescue equipment ready. Entrant, attendant, supervisor all trained."},
{q:"Confined space O2 minimum for safe entry is:",opts:["19.5%", "16.5%", "23.5%", "12.5%"],ans:0,exp:"Below 19.5% = oxygen-deficient. Above 23.5% = oxygen-enriched (fire risk). Normal air is 20.9%. Test before entry, monitor continuously."},
{q:"Confined space O2 maximum for safe entry (no enrichment) is:",opts:["21%", "No upper limit", "50%", "23.5%"],ans:3,exp:"Above 23.5% = oxygen-enriched atmosphere. Materials burn more aggressively, including those normally considered fire-resistant. Same testing trigger as low oxygen."},
{q:"Lower explosive limit (Lower Explosive Limit) maximum for safe confined space entry is:",opts:["50% of lower explosive limit", "10% of lower explosive limit", "100% of lower explosive limit", "1% of lower explosive limit"],ans:1,exp:"10% of lower explosive limit = the safety threshold. Above 10%, evacuate and ventilate. Lower explosive limit meters report as percentage of lower explosive limit, not absolute concentration."},
{q:"A confined space attendant's role is to:",opts:["Go in and help if the entrant struggles", "Stay outside, keep contact, and call rescue", "Enter with the worker as a second set of hands", "Run errands to keep the entrant supplied"],ans:1,exp:"Attendant stays outside, maintains communication, monitors entrant, summons rescue. Cannot enter the space — would create another victim. Trained, present, sober, communicating."}
],
estimating:[
{q:"A wall is 25 ft long and 8 ft tall. Total area is:",opts:["33 sq ft", "250 sq ft", "400 sq ft", "200 sq ft"],ans:3,exp:"Length \u00d7 height = 25 \u00d7 8 = 200 sq ft. Basic rectangle area for a wall. Watch for distractor that adds the dimensions instead of multiplying."},
{q:"A wall is 30 ft long and 10 ft tall. Total area is:",opts:["600 sq ft", "300 sq ft", "200 sq ft", "40 sq ft"],ans:1,exp:"30 \u00d7 10 = 300 sq ft. The 600 distractor is two walls; 40 is the perimeter mistake."},
{q:"A room is 12 ft \u00d7 14 ft with 9 ft ceilings. Total wall area (no openings deducted) is:",opts:["168 sq ft", "432 sq ft", "234 sq ft", "468 sq ft"],ans:3,exp:"Perimeter = 2(12+14) = 52 ft. Wall area = 52 \u00d7 9 = 468 sq ft. Common exam pattern \u2014 calculate perimeter, multiply by height."},
{q:"A room is 16 ft \u00d7 20 ft with 9 ft ceilings. Total wall area (no deductions) is:",opts:["648 sq ft", "320 sq ft", "432 sq ft", "720 sq ft"],ans:0,exp:"Perimeter = 2(16+20) = 72 ft. Wall area = 72 \u00d7 9 = 648 sq ft. Don't multiply length \u00d7 width \u00d7 height \u2014 that's volume."},
{q:"A coating covers 350 sq ft per gallon. To apply 2 coats over 2,800 sq ft, the painter needs:",opts:["8 gallons", "4 gallons", "12 gallons", "16 gallons"],ans:3,exp:"Total coverage needed = 2,800 \u00d7 2 coats = 5,600 sq ft. Gallons = 5,600 \u00f7 350 = 16 gallons exactly. Don't forget to multiply by number of coats."},
{q:"A coating covers 400 sq ft per gallon. To apply 2 coats over 4,800 sq ft, the painter needs:",opts:["12 gallons", "16 gallons", "32 gallons", "24 gallons"],ans:3,exp:"4,800 \u00d7 2 = 9,600 total sq ft. 9,600 \u00f7 400 = 24 gallons. Always multiply area by number of coats first."},
{q:"A coating covers 300 sq ft per gallon. To apply 1 coat over 1,500 sq ft, the painter needs:",opts:["3 gallons", "8 gallons", "5 gallons", "10 gallons"],ans:2,exp:"1,500 \u00f7 300 = 5 gallons. Single-coat application = simple division."},
{q:"A theoretical coverage formula for a coating is:",opts:["1604 × % volume solids × dry film thickness", "1604 × % volume solids ÷ dry film thickness", "1604 × dry film thickness ÷ % volume solids", "1604 ÷ (% volume solids × dry film thickness)"],ans:1,exp:"Memorize: Coverage = 1604 × % volume solids ÷ dry film thickness (mils) = sq ft per gallon at that dry film thickness. The 1604 comes from 1 gallon = 231 cu in spread to 1 mil thickness. Frequently tested."},
{q:"A material is 50% solids by volume. Theoretical coverage at 1 mil dry film thickness is approximately:",opts:["200 sq ft/gal", "1,604 sq ft/gal", "800 sq ft/gal", "802 sq ft/gal"],ans:3,exp:"1604 \u00d7 0.50 \u00f7 1 = 802 sq ft/gal. The 800 distractor is close but technically wrong \u2014 the formula gives 802 exactly."},
{q:"A material is 60% solids by volume. Theoretical coverage at 1 mil dry film thickness is approximately:",opts:["1,000 sq ft/gal", "600 sq ft/gal", "1,604 sq ft/gal", "962 sq ft/gal"],ans:3,exp:"1604 \u00d7 0.60 \u00f7 1 = 962.4 sq ft/gal. Higher solids = more coverage at given dry film thickness."},
{q:"A material is 65% solids by volume. Theoretical coverage at 4 mils dry film thickness is approximately:",opts:["100 sq ft/gal", "1,043 sq ft/gal", "261 sq ft/gal", "400 sq ft/gal"],ans:2,exp:"1604 \u00d7 0.65 \u00f7 4 = 260.65 sq ft/gal. Higher dry film thickness = less coverage. The 1,043 distractor is the value at 1 mil."},
{q:"A coating spec calls for 4 mils dry film thickness. The product is 50% solids. Wet film thickness should be approximately:",opts:["6 mils", "4 mils", "2 mils", "8 mils"],ans:3,exp:"Wet film thickness = dry film thickness \u00f7 % solids = 4 \u00f7 0.50 = 8 mils wet. As solvent evaporates, the film shrinks to dry thickness."},
{q:"A coating spec calls for 6 mils dry film thickness. The product is 60% solids. Wet film thickness should be approximately:",opts:["12 mils", "10 mils", "6 mils", "8 mils"],ans:1,exp:"Wet film thickness = 6 \u00f7 0.60 = 10 mils wet. Apply at 10 mils wet, ends up 6 mils dry after solvent evaporates."},
{q:"A coating spec calls for 3 mils dry film thickness. The product is 75% solids. Wet film thickness should be approximately:",opts:["6 mils", "2.25 mils", "4 mils", "3 mils"],ans:2,exp:"Wet film thickness = 3 \u00f7 0.75 = 4 mils. High solids product, only minor solvent evaporation."},
{q:"A wet film thickness of 10 mils on a 50%-solids coating produces a dry film thickness of:",opts:["5 mils", "10 mils", "2 mils", "20 mils"],ans:0,exp:"Dry film thickness = wet film thickness \u00d7 % solids = 10 \u00d7 0.50 = 5 mils dry. Half the wet film evaporates as solvent."},
{q:"A wet film thickness of 8 mils on a 65%-solids coating produces a dry film thickness of:",opts:["4.8 mils", "12.3 mils", "5.2 mils", "8.0 mils"],ans:2,exp:"8 × 0.65 = 5.2 mils dry. Higher solids = closer wet/dry ratio."},
{q:"A wet mil gauge is used:",opts:["Only on metal, after the film dries", "To check dry film thickness on wood and drywall", "Right after application, through the wet film", "After the coating has fully cured"],ans:2,exp:"Wet mil gauge (notched comb): drag perpendicular through wet film. Highest tooth that left a mark = wet film thickness. Use immediately — film starts to dry within minutes."},
{q:"A magnetic dry-film gauge is used on:",opts:["Wood siding", "Any substrate", "Aluminum", "Ferrous metal"],ans:3,exp:"Magnetic gauges work on steel/iron. Eddy-current gauges work on non-ferrous metals. Other substrates need destructive cross-section or ultrasonic measurement."},
{q:"A 1,800 sq ft house exterior gets 2 coats. Practical coverage is 250 sq ft/gal first coat, 350 sq ft/gal second coat. Total gallons (no waste) is approximately:",opts:["7.2 gallons", "14.4 gallons", "12.4 gallons", "10.3 gallons"],ans:2,exp:"Coat 1: 1,800 ÷ 250 = 7.2 gal. Coat 2: 1,800 ÷ 350 = 5.14 gal. Total = 12.34 gal. First coat covers less on porous substrate."},
{q:"A job needs 28 gallons of paint. With a 10% waste factor (rounded up to whole gallons), the order quantity is:",opts:["31 gallons", "30 gallons", "28 gallons", "35 gallons"],ans:0,exp:"28 \u00d7 1.10 = 30.8 \u2192 round up to 31. Always round up gallons \u2014 can't easily buy partial gallons, and running short mid-job is worse than slight waste."},
{q:"A job needs 45 gallons of paint. With a 15% waste factor (rounded up to whole gallons), the order quantity is:",opts:["55 gallons", "50 gallons", "52 gallons", "47 gallons"],ans:2,exp:"45 \u00d7 1.15 = 51.75 \u2192 round up to 52. 15% waste is on the high side \u2014 used for difficult substrates or inexperienced crews."},
{q:"A spray crew applies coating at 1,200 sq ft per hour. A 9,600 sq ft warehouse interior takes approximately:",opts:["5 hours", "12 hours", "16 hours", "8 hours"],ans:3,exp:"9,600 \u00f7 1,200 = 8 hours. Standard production math: total area \u00f7 rate = hours."},
{q:"A spray crew applies coating at 800 sq ft per hour. A 6,400 sq ft surface takes approximately:",opts:["12 hours", "4 hours", "8 hours", "6 hours"],ans:2,exp:"6,400 \u00f7 800 = 8 hours. Production rate calculations are straight division."},
{q:"Labor at $55/hour for 36 hours costs:",opts:["$2,500", "$1,650", "$1,980", "$2,200"],ans:2,exp:"55 \u00d7 36 = $1,980. Straightforward labor cost: rate \u00d7 hours."},
{q:"Labor at $65/hour for 50 hours costs:",opts:["$3,500", "$3,000", "$2,500", "$3,250"],ans:3,exp:"65 \u00d7 50 = $3,250. Labor cost basics."},
{q:"A bid is calculated as $2,400 materials + $5,600 labor + 20% overhead and profit. Total bid is:",opts:["$9,600", "$8,000", "$10,000", "$10,800"],ans:0,exp:"Subtotal: 2,400 + 5,600 = $8,000. With 20% overhead and profit: 8,000 \u00d7 1.20 = $9,600. Standard bid calculation."},
{q:"A bid is calculated as $1,500 materials + $4,000 labor + 15% overhead and profit. Total bid is:",opts:["$5,500", "$7,000", "$6,325", "$6,500"],ans:2,exp:"Subtotal: 1,500 + 4,000 = $5,500. With 15% overhead and profit: 5,500 \u00d7 1.15 = $6,325."},
{q:"Markup of 50% on a $1,000 cost results in a sale price of:",opts:["$5,000", "$1,050", "$1,500", "$2,000"],ans:2,exp:"Markup = % added to cost. 1,000 \u00d7 1.50 = $1,500. Don't confuse with margin (which is % of sale price)."},
{q:"Margin of 50% on a $1,500 sale price means cost was:",opts:["$1,000", "$2,250", "$500", "$750"],ans:3,exp:"Margin = % of sale price. 50% margin = cost is half the sale. 1,500 \u00d7 0.50 = $750. Markup vs margin is a common business math distinction."},
{q:"A 10% discount on a $4,500 quote reduces it to:",opts:["$4,150", "$4,000", "$4,500", "$4,050"],ans:3,exp:"4,500 \u00d7 0.90 = $4,050. Discount calculation: subtract the discount % from 100%, multiply."},
{q:"Crown molding around a 14 ft \u00d7 18 ft room totals (in linear feet):",opts:["None \u2014 crown is in sq ft", "30 LF", "64 LF", "252 LF"],ans:2,exp:"Perimeter = 2(14+18) = 64 LF. Crown molding is linear, not square. The 252 distractor is the floor area in sq ft \u2014 wrong unit."},
{q:"A door 3 ft \u00d7 6'8\" has approximately what area on one side:",opts:["9 sq ft", "36 sq ft", "80 sq ft", "20 sq ft"],ans:3,exp:"3 \u00d7 6.67 = 20 sq ft. Standard interior door dimension. Memorize ~20 sq ft for quick estimates."},
{q:"A round storage tank with 20 ft diameter and 30 ft height has approximate exterior side surface area (\u03c0DH):",opts:["1,200 sq ft", "1,884 sq ft", "3,000 sq ft", "600 sq ft"],ans:1,exp:"Cylinder side = \u03c0 \u00d7 diameter \u00d7 height = \u03c0 \u00d7 20 \u00d7 30 = 1,884 sq ft. Don't confuse with full surface area (which would include top and bottom)."},
{q:"A triangular gable end is 30 ft wide at the base and 8 ft tall at the peak. Area is:",opts:["60 sq ft", "240 sq ft", "120 sq ft", "480 sq ft"],ans:2,exp:"Triangle area = \u00bd \u00d7 base \u00d7 height = \u00bd \u00d7 30 \u00d7 8 = 120 sq ft. The 240 distractor forgets to halve."},
{q:"A 1-gallon paint container holds:",opts:["128 fluid ounces", "64 fluid ounces", "256 fluid ounces", "512 fluid ounces"],ans:0,exp:"1 gallon = 128 fl oz. 1 quart = 32 fl oz. 1 pint = 16 fl oz. Used for thinning calculations."},
{q:"A 1-quart paint container holds:",opts:["32 fluid ounces", "16 fluid ounces", "128 fluid ounces", "64 fluid ounces"],ans:0,exp:"1 quart = 32 fl oz = \u00bc gallon. 4 quarts in a gallon."},
{q:"Thinning paint by 10% means adding:",opts:["12.8 oz per gallon", "6.4 oz per gallon", "10 oz per gallon", "25.6 oz per gallon"],ans:0,exp:"10% of 128 oz (one gallon) = 12.8 oz per gallon. Common thinning ratio for spray application of latex."},
{q:"A two-component coating with a 2:1 mix ratio means:",opts:["2 parts A to 1 part B by volume", "2 parts paint to 1 part water", "Equal parts A and B by volume", "1 part A to 2 parts B by volume"],ans:0,exp:"2:1 = 2 parts of part A for every 1 part of part B. By volume unless specified by weight. Off-ratio mixing = won't cure properly."},
{q:"For a 3-gallon batch of a 2:1 ratio coating, the painter mixes:",opts:["2 gal A + 1 gal B", "1.5 gal A + 1.5 gal B", "1 gal A + 2 gal B", "3 gal A + 3 gal B"],ans:0,exp:"2:1 ratio with 3 gallons total = 2 parts (gal) of A and 1 part (gal) of B. Total parts in ratio = 3 (so 2/3 + 1/3 of total = 2:1)."},
{q:"Gallons calculated to 8.6 should be ordered as:",opts:["8 gallons", "10 gallons", "11 gallons", "9 gallons"],ans:3,exp:"Round up to next whole gallon. 8.6 → 9. Don't round down (you'll run short) or round up by 2 (waste)."},
{q:"A 1,000 sq ft job at 350 sq ft/gal first coat + 400 sq ft/gal second coat needs approximately:",opts:["2.9 gallons", "5.4 gallons", "5.0 gallons", "5.7 gallons"],ans:1,exp:"Coat 1: 1,000 ÷ 350 = 2.857 gal. Coat 2: 1,000 ÷ 400 = 2.5 gal. Total = 5.357 gal."},
{q:"Estimating 'linear feet' applies to:",opts:["Wall and ceiling area in a room", "Ceiling area, measured in rows", "The volume of paint in gallons", "Trim, baseboard, and crown molding"],ans:3,exp:"Linear feet = measurement along a line. Trim and molding work measured this way. Square feet for areas. Cubic feet for volume."},
{q:"A unit price of $1.25 per sq ft applied to 2,400 sq ft yields:",opts:["$3,000", "$1,250", "$5,000", "$300"],ans:0,exp:"1.25 \u00d7 2,400 = $3,000. Unit pricing for bidding \u2014 straightforward multiplication."},
{q:"A profit margin of 20% on a job priced at $10,000 means the cost was approximately:",opts:["$9,000", "$5,000", "$8,000", "$12,000"],ans:2,exp:"20% margin = profit is 20% of sale price. Cost = 80% of sale = $8,000. Margin formula: cost = sale \u00d7 (1 - margin %)."},
{q:"A 3,200 sq ft job, 2 coats, with first coat at 300 sq ft/gal and second coat at 400 sq ft/gal, requires approximately:",opts:["10.7 gallons", "16.0 gallons", "18.7 gallons", "21.3 gallons"],ans:2,exp:"Coat 1: 3,200 ÷ 300 = 10.67 gal. Coat 2: 3,200 ÷ 400 = 8 gal. Total = 18.67 gal."}
],
failures:[
{q:"Sheet peeling on exterior wood siding 1 year after a quality repaint is MOST likely caused by:",opts:["Moisture getting in from behind the siding", "Brushes that left the film too thin", "Using a satin instead of a flat sheen", "UV breaking down the topcoat's binder in the first summer"],ans:0,exp:"Sheet peeling = moisture pushing the film off from underneath. Look for: roof leaks, flashing failures, no vapor barrier inside, sprinklers hitting siding, high interior humidity. Fix the moisture, then repaint."},
{q:"Solvent blisters appearing within hours on a freshly painted south-facing wall in summer are caused by:",opts:["Water vapor pushing out from inside the house through the wall", "Solvent trapped under a skin on a hot surface", "Paint applied too cold to dry properly", "UV light attacking the fresh film"],ans:1,exp:"Hot substrate flashes solvent off the top of the film instantly, then the lower layer's solvent can't escape — pushes up as blisters. Don't paint in direct sun on hot walls."},
{q:"Moisture blisters on a freshly painted exterior wall after rain are caused by:",opts:["Solvent trapped under the film by painting in hot sun", "UV exposure softening the new film", "Water vapor from a substrate that was still damp", "Using too thin a coat of primer"],ans:2,exp:"Different mechanism than solvent blisters. Moisture from inside the wall (or trapped at application) pushes through the film when warmed. Wait for substrates to fully dry."},
{q:"A network of cracks resembling alligator skin in a topcoat indicates:",opts:["Alkali in the substrate attacking the alkyd binder underneath", "Mildew growing under the paint film", "A hard topcoat over a soft or uncured undercoat", "UV breaking down the binder into powder"],ans:2,exp:"Alligatoring = the layers move differently. Hard topcoat over soft undercoat (or under-cured undercoat) = the surface cracks in a pattern like reptile skin. Strip and rebuild with compatible system."},
{q:"Saponification produces:",opts:["A white, powdery residue on the surface", "A soft, sticky, soap-like film", "A hard film that cracks like alligator skin", "Tiny pinholes across the surface"],ans:1,exp:"Alkali (zinc, fresh concrete) + alkyd ester = literal soap. Film stays soft, sticky, smudges. Strip and recoat with alkali-resistant primer. Common on galvanized and new concrete with oil paints."},
{q:"Efflorescence on masonry is:",opts:["Alkali reacting with an alkyd binder", "Mildew growing on damp masonry", "Salts carried to the surface by moisture", "Binder breakdown that leaves loose pigment"],ans:2,exp:"Water migrates through masonry, dissolves soluble salts, evaporates at surface, leaves white crystalline deposits. Don't seal it in — fix moisture and remove salts before coating."},
{q:"Mildew on a previously painted surface is identified by:",opts:["A bleach test: mildew lightens, dirt doesn't", "A moisture meter reading above 15%", "A heat test: mildew darkens when warmed", "A tape test: mildew lifts off with the tape, dirt stays put"],ans:0,exp:"Diluted bleach (3:1 water/bleach) lightens mildew within seconds. Dirt stays the same color. Standard field test before deciding cleaning approach."},
{q:"Chalking on an exterior coating is:",opts:["Normal weathering as UV breaks down the binder", "Salt deposits pushed out by efflorescence", "An early sign of mildew growth", "A defect caused by the painter's application technique"],ans:0,exp:"Chalking is normal aging. UV breaks down binder, leaving pigment dust on surface. Heavy chalking = poor product or extreme exposure. Wash, test for residue, prime with bonding primer, recoat."},
{q:"Lifting of a topcoat (the topcoat wrinkles and pulls away from the undercoat) is caused by:",opts:["A cold substrate during application", "Moisture in the substrate pushing through from behind it", "The undercoat being fully cured first", "Topcoat solvent attacking an uncured undercoat"],ans:3,exp:"Strong solvents in topcoat dissolve the undercoat. The wrinkled topcoat is the visible symptom. Wait for full cure, or use compatible products."},
{q:"Fish eyes (small craters) in a sprayed coating are caused by:",opts:["A cold substrate during spraying", "Silicone, oil, or wax on the surface", "A spray tip that is too small", "Too much primer under the topcoat"],ans:1,exp:"Coating refuses to wet over a contaminated spot, creates a circular crater. Silicone (furniture polish, mold release) is the #1 culprit. Wipe with appropriate solvent or use fish-eye eliminator."},
{q:"Cratering / pinholing in a coating can be caused by:",opts:["Choosing a flat instead of a satin sheen", "Air or solvent escaping, or substrate outgassing", "Surface contamination, and nothing else", "Using a deep-tone base with heavy colorant loads"],ans:1,exp:"Pinholes = something escaping through the wet film. Trapped air bubbles from over-stirring, fast solvent evaporation, or substrate outgassing. Apply over a sealer first to prevent."},
{q:"Runs and sags in a freshly applied coating are MOST commonly caused by:",opts:["Applying too thin a film for the paint to flow and level", "Too much material, too close, or too slow", "A cold substrate, and nothing else", "Choosing a gloss instead of a flat"],ans:1,exp:"Too much material = gravity wins. Usual causes: excessive material in one pass, holding the gun too close, moving too slowly, or overthinning. Sags appear as drips or curtains. Adjust technique: less material per pass, faster movement, correct distance, less thinning."},
{q:"Lap marks on a freshly rolled wall are caused by:",opts:["Losing the wet edge between sections", "Thinning the paint more than 10%", "Applying too much paint per pass", "Using a different batch of paint"],ans:0,exp:"Wet edge dies = visible stripe where dried paint meets fresh paint. Fix by working faster, smaller sections, working in cooler conditions. Hot/dry environments worsen this."},
{q:"Flashing (visible difference in sheen and color in patches across a wall) is caused by:",opts:["Rollers with different nap lengths", "Uneven porosity under the paint", "Changing sunlight while painting", "Painting in high humidity"],ans:1,exp:"Spot-primed patches have different porosity than primed wall — paint absorbs differently and shows. Solution: prime the entire wall to even out porosity before topcoating."},
{q:"Surfactant leaching (brown sticky streaks on fresh latex, especially dark colors) is prevented by:",opts:["Using oil-based paint for every exterior job", "Adding extra water to the paint", "Not painting when dew or rain is coming soon", "Painting late in the afternoon, whatever the dew"],ans:2,exp:"Surfactants are water-soluble. If moisture hits before they're locked in, they leach to the surface as brown streaks. Avoid late-afternoon painting that gets dewed. Wash off with water once cured."},
{q:"Burnishing (shiny spots in a flat or matte finish where rubbed) is caused by:",opts:["Using the wrong primer under the flat", "A bad batch of paint from the factory", "Rubbing that polishes the soft flat finish", "High humidity while the paint cured"],ans:2,exp:"Flat paint isn't designed for friction. Doors, hallways, around switches polish to shine. The fix is a higher sheen in high-touch areas: hospitals and commercial spaces spec eggshell or satin there to prevent it."},
{q:"Yellowing of a white alkyd coating over time is caused by:",opts:["Normal aging of the alkyd, worse in low light", "Strong UV exposure from nearby windows and skylights", "Efflorescence from the wall behind", "Mildew growing within the film"],ans:0,exp:"Alkyds yellow with age. Worse in dark areas (light bleaches them). Use waterborne acrylic for white interior trim that should stay white. Or accept slight color shift over years."},
{q:"Color fading of bright reds and yellows on a south-facing exterior is caused by:",opts:["Cold weather during application", "Using the wrong primer underneath", "UV breaking down the organic pigments", "High humidity in the summer months"],ans:2,exp:"Organic pigments (bright colors) degrade in UV. Inorganic earth-tone pigments (iron oxides) are nearly indestructible. Set client expectations on bright colors south/west exposures."},
{q:"Cracking and crazing of an aged coating is caused by:",opts:["Too much primer on the first coat", "Choosing a color that's too dark", "UV exposure alone, with no other contributing cause", "A brittle film, heavy buildup, or movement"],ans:3,exp:"Coatings get brittle with age and stop flexing with substrate movement. Excessive film build (too many recoats over decades) makes it worse. Eventually requires strip and rebuild."},
{q:"Wrinkling of a topcoat shortly after application can be caused by:",opts:["Choosing the wrong sheen for the room", "Applying the topcoat in ideal conditions", "A cold substrate and nothing else", "Too thick a film, or an uncured undercoat"],ans:3,exp:"Surface dries before underneath — surface skins, underneath continues evaporating, surface wrinkles. Apply at correct mil thickness, allow undercoat to cure properly."},
{q:"A coating that won't dry past the tacky stage may indicate:",opts:["A perfectly normal cure for epoxy", "Applying it in low humidity", "Thinning it with the right solvent", "Off-ratio mixing or contamination"],ans:3,exp:"Two-component products require precise mix ratios. Off-ratio = won't cure or cures soft. Verify mix ratio, check for contamination (water in oil systems), and follow induction time if specified."},
{q:"A glossy spray finish that develops orange peel texture is caused by:",opts:["A cold substrate under the coating", "Too much primer under the topcoat", "Too far, too much pressure, or wrong viscosity", "Spraying too close to the surface with a slow pass"],ans:2,exp:"Material doesn't flow out before drying. Causes: spraying too far away, excessive pressure, improper viscosity, or fast solvent evaporation. Bring the gun closer, lower pressure, adjust viscosity, paint in slower-drying conditions."},
{q:"'Picture framing' (visible band around the perimeter of a wall) is caused by:",opts:["Cut-in that dried before it was rolled into", "A bad primer that didn't seal the wall evenly underneath", "Using the wrong sheen on the walls", "Cutting in with too wide a brush"],ans:0,exp:"Cut-in dries → roller can't blend into it → 3-inch visible border. Solution: roll into wet cut-in immediately. Don't cut in entire room first then roll."},
