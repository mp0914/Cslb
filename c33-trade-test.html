{q:"A coating that fails on the lower portion of an exterior wall but holds on the upper portion suggests:",opts:["Wrong primer used only on the lower siding boards", "UV failure from reflected sunlight", "Splash-back moisture from grade or sprinklers", "A roof or flashing leak above"],ans:2,exp:"Pattern matters. Lower-wall failure = moisture from grade. Upper-wall failure = roof/flashing. Around windows = window flashing. Diagnose by location."},
{q:"A coating that fails around windows but holds elsewhere suggests:",opts:["UV light reflecting off the window glass", "Water getting in at flashing or caulk", "A defect from the window manufacturer", "The window frames being the wrong color"],ans:1,exp:"Localized failure = localized cause. Window failures = flashing leak, caulk failure, or condensation. Repair the source first, then repaint the affected area."},
{q:"Rust bleeding through a topcoat on metal indicates:",opts:["Rust that wasn't fully removed or inhibited", "Mildew growing under the topcoat on the metal", "A topcoat color that's too light", "UV breaking down the topcoat"],ans:0,exp:"Rust under coating continues to corrode and bleeds through as orange stains. Strip back to clean sound metal, prime with rust-inhibitive primer, then topcoat."},
{q:"A coating that develops cracks following the wood grain on siding is caused by:",opts:["Cold weather alone, with no other cause", "UV exposure alone, with no other cause", "Choosing too dark a color", "Wood movement under a brittle coating"],ans:3,exp:"Wood moves with humidity. Brittle coatings can't stretch with the movement and crack along the grain. Use flexible 100% acrylic for exterior wood."},
{q:"A coating that develops cracks across (perpendicular to) the wood grain indicates:",opts:["Normal aging of any exterior paint after several years", "Severe movement or a structural problem", "A bad primer under the topcoat", "Using a sheen that is too high"],ans:1,exp:"Cross-grain cracks = severe substrate movement. Check for structural issues (settling, joist failure, water damage) before just repainting. Can also indicate very old/brittle coating."},
{q:"A latex coating applied at temperatures below 50°F may exhibit:",opts:["Better hide, since the film dries thicker and slower", "A faster cure and an earlier recoat time than usual", "Poor film formation and weak adhesion", "Higher gloss than normal"],ans:2,exp:"Latex coalesces only above ~50°F (35°F for low-temp formulas). Below that, the binder doesn't form a continuous film — cracks and adhesion failure even after the surface looks dry."},
{q:"A latex coating applied with the surface temperature near or below the dew point may exhibit:",opts:["No problems once the sun comes up", "Surfactant leaching and blistering", "A faster dry from the cool air", "A normal cure with higher gloss"],ans:1,exp:"Surface below dew point = condensation forms during application or curing. Water under coating = blisters, surfactant leach, adhesion failure. Always 5°F above dew point during application AND cure."},
{q:"Mildew that returns within months of repainting indicates:",opts:["The mildew wasn't killed before painting", "The color chosen was too dark", "The new paint was defective from the factory", "Too much paint was applied"],ans:0,exp:"Mildew under fresh paint just keeps growing. Fix: kill thoroughly with bleach or biocide, allow to dry, then prime and topcoat with mildew-resistant product."},
{q:"Coating peeling localized at a roof leak area indicates:",opts:["An active leak to fix before repainting", "UV exposure near the roof line", "The roofer's fault, so just repaint", "A bad batch of paint on that wall"],ans:0,exp:"Coatings can't out-perform an active leak. Fix the leak, allow drying, repair drywall/wood damage, then repaint. Anything else just wastes paint."},
{q:"A coating that adheres well immediately but fails after 6 months suggests:",opts:["Normal performance for exterior paint in its first year", "A hidden prep problem like chalk or moisture", "Using the wrong sheen for the surface", "A color mismatch between the coats"],ans:1,exp:"Slow failures usually trace to prep. Initial bond was OK, but underlying issue undermined it over time. Common with chalking and slow moisture problems."},
{q:"A coating with patchy gloss differences (some areas glossy, some flat) shortly after application indicates:",opts:["Using the wrong product for the room's traffic level", "Using the wrong tint formula", "Uneven porosity or uneven film thickness", "A trick of the light in photos"],ans:2,exp:"Gloss varies with film thickness and substrate absorption. Even out by priming first to equalize porosity, and applying consistent mil thickness."},
{q:"Diagnosing a coating failure starts with:",opts:["Identifying the substrate, history, and pattern", "Recoating right away with a better grade of paint", "Switching to a different brand", "Adding one more coat over the area"],ans:0,exp:"Diagnose root cause first: the substrate, the previous coating system, the application conditions, and the failure pattern. Just recoating without understanding why doesn't fix anything."},
{q:"Bleeding of a previous color through a new topcoat indicates:",opts:["UV fading of the new topcoat", "Using the wrong sheen over it", "Poor hide or no stain-blocking primer", "Normal hide for a single coat"],ans:2,exp:"Strong colors bleed through poor coverage. Solution: use a stain-blocking primer (shellac for severe), or apply two coats of a high-hide topcoat. Common with red over white or vice versa."},
{q:"A topcoat that appears uniform when wet but dries with sheen variation across the wall indicates:",opts:["A color shift as the paint dries", "Uneven film build or uneven porosity", "A defect from the manufacturer", "Normal latex behavior as it cures"],ans:1,exp:"Sheen reveals application inconsistency. Even out with prime + consistent technique. Higher sheens are less forgiving than flats."},
{q:"Adhesion failure at the interface between primer and topcoat (topcoat peels but primer stays) indicates:",opts:["A missed recoat window or incompatible primer", "UV damage breaking down the topcoat", "Moisture coming through the substrate from behind the wall", "A normal result for a two-coat system"],ans:0,exp:"Topcoat peeling from primer = problem at the interface. Primer cured too long without recoat (now needs scuff sand), or topcoat doesn't bond to that primer chemistry, or primer got contaminated before topcoat."},
{q:"Adhesion failure at the interface between primer and substrate (entire system peels off) indicates:",opts:["UV damage breaking down the topcoat", "Poor prep: chalk, moisture, or wrong primer", "A missed recoat window between coats", "Normal aging for any exterior paint"],ans:1,exp:"Whole system peels = primer didn't bond to substrate. Always traces to prep: residual chalk, moisture, contamination, or wrong primer chemistry for the substrate."},
{q:"A coating that becomes dull and chalky in 6 months indicates:",opts:["Normal aging for any exterior paint", "Using too high a sheen outdoors", "Premature UV breakdown from a weak product", "High humidity during the first few days while the paint cured"],ans:2,exp:"Premature chalking = product failure. Cheap vinyl binders chalk fast. Or product wasn't rated for the exposure. Or deep base was overloaded with tint, weakening the binder."}
],
environmental:[
{q:"Regional air quality district Rule 1113 sets volatile organic compound (VOC) limits for architectural coatings. The current limit for flat coatings is approximately:",opts:["380 g/L", "500 g/L", "50 g/L", "250 g/L"],ans:2,exp:"Regional air quality district Rule 1113 (the most stringent in CA): flat coatings \u226450 g/L. Verify current numbers before exam day \u2014 they get tightened over time."},
{q:"Regional air quality district Rule 1113 (the air district&rsquo;s architectural coatings rule) limit for non-flat (eggshell, satin, semi-gloss, gloss) coatings is approximately:",opts:["100 g/L", "50 g/L", "450 g/L", "250 g/L"],ans:0,exp:"Non-flat \u2264100 g/L under regional air quality district Rule 1113. Higher than flat because non-flat coatings need more solvent for film formation. Specialty categories have different limits."},
{q:"VOC stands for:",opts:["Volatile organic compounds", "Volume of coating content per gallon", "Viscosity of the coating", "Vapor output of coatings"],ans:0,exp:"VOC = volatile organic compounds: chemicals that evaporate at room temperature and contribute to ground-level ozone (smog). Regulated by air districts. Driving force behind waterborne paint adoption."},
{q:"California's most stringent air district for architectural coatings is generally:",opts:["Sacramento Metropolitan Air Quality Management District", "South Coast Air Quality Management District", "San Diego Air Pollution Control District", "Bay Area Air Quality Management District"],ans:1,exp:"South Coast Air Quality Management District (AQMD) covers Los Angeles, Orange, and parts of Riverside and San Bernardino counties — the most populated, most polluted air basin in California. It sets the strictest limits, which other districts often adopt. Familiar to most California painters working south of the Tehachapis."},
{q:"A painter buys paint from outside the air district to use in a air-district-regulated jobsite. This is:",opts:["Allowed, as long as it costs less", "Always allowed if it was bought legally somewhere else", "Encouraged to support out-of-area stores", "A violation if it exceeds the local VOC limit"],ans:3,exp:"VOC rules apply at the use location, not the purchase location. Bringing high-VOC paint into a regulated district = violation. Manufacturers stock compliant products in regulated regions."},
{q:"PaintCare in California is:",opts:["A paint manufacturer's extended warranty plan for homeowners", "A state pesticide control program", "A federal agency that tests paint", "A paint recycling program funded by a fee"],ans:3,exp:"PaintCare = paint recycling stewardship. Drop off unused paint at participating retailers. Funded by a small fee added to paint sales. Reduces waste and gives paint a second life."},
{q:"Liquid latex paint disposal:",opts:["Poured down the sink while running plenty of water", "Solidified or recycled, never down a drain", "Put in the regular trash still liquid", "Buried on site away from the house"],ans:1,exp:"Latex is water-based but the binders and pigments aren't 'just water.' Never pour it to drains. Solidify it (cat litter or paint hardener) or recycle it through PaintCare or household hazardous waste. Many municipalities accept solidified latex as regular waste."},
{q:"Solvent-based paint disposal:",opts:["Regular trash, once the can lid is sealed tight", "Hazardous waste, through a licensed handler", "Poured into the soil to evaporate", "Burned on site in a metal drum"],ans:1,exp:"Solvent-based = hazardous waste under California rules. Manifested through licensed hauler. Pouring into soil or burning = serious environmental violations with significant fines."},
{q:"Lead lead-safe renovation rule debris in California is:",opts:["Safe to wash into storm drains", "Regular construction waste that can go to any dump", "Recyclable as ordinary scrap", "Hazardous waste, shipped by licensed haulers"],ans:3,exp:"California treats lead waste more strictly than federal. Plastic sheeting, debris, water, used personal protective equipment (PPE) all = hazardous waste. Licensed disposal with manifests required."},
{q:"Empty metal paint cans (latex, fully dried residue) are typically:",opts:["Returned to the manufacturer by law", "Hazardous waste in every case", "Solid waste in many places once fully dried", "Sent back to the paint store for a recycling deposit"],ans:2,exp:"RCRA empty container rule: ≤1 inch or ≤3% residue = empty. Fully dried latex cans typically qualify and can go to scrap recycling. Verify local rules."},
{q:"Solvent-soaked rags:",opts:["Piled in a corner of the jobsite until the job ends", "Buried on site away from buildings", "Tossed loose into the regular trash", "Kept in a covered metal can until disposal"],ans:3,exp:"Spontaneous combustion is real — linseed oil rags self-ignite from oxidation heat. Store them in a covered, self-closing Underwriters Laboratories (UL)-listed metal safety can, then dispose of them as hazardous waste or send them to an industrial laundry. Never pile rags."},
{q:"Latex rinse water from cleaning brushes and rollers:",opts:["Poured on the ground to soak in", "Poured into the nearest storm drain", "Kept out of storm drains entirely", "Left in buckets on site indefinitely"],ans:2,exp:"Storm drains go directly to creeks/ocean — no treatment. Sanitary sewer → wastewater treatment, OK with utility OK. Better: solidify and dispose. Storm drain pouring = serious fines and environmental damage."},
{q:"Stormwater pollution prevention on a paint jobsite includes:",opts:["Keeping wash water and spills out of drains", "Letting wash water run off to the street gutter", "Pressure washing to flush debris away", "Rinsing solvent down the nearest drain"],ans:0,exp:"Cover storm drains during washing, contain spills, manage debris. Most municipalities have stormwater ordinances. Violations carry significant penalties."},
{q:"A paint specification names a specific product. The painter wants to substitute a different product. The correct procedure is:",opts:["Refuse the job since the spec is fixed", "Submit a written request and get approval", "Substitute it and tell them afterward", "Bill for the named product, use the other"],ans:1,exp:"Specs are contracts. Unauthorized substitution = breach. Submit the substitution request with technical data sheet comparison, get architect/owner approval in writing, then proceed."},
{q:"A change order on a painting project should be:",opts:["Billed at the end with no prior approval", "Done without any notice if the change is minor", "Written and signed before the work proceeds", "Agreed verbally, with no paperwork"],ans:2,exp:"Verbal change orders = non-payment disputes. Document scope, cost, schedule, get signatures, then perform. Protects both contractor and owner."},
{q:"A 'punch list' at project completion is:",opts:["The contractor's final invoice", "The final safety inspection report for the jobsite", "Items to fix before the job is accepted", "A list of new work to be added"],ans:2,exp:"Punch list = remaining items before acceptance. Walk-through with owner or general contractor, document items, complete them, get sign-off. Final payment usually tied to punch list completion."},
{q:"A finish schedule on construction plans is:",opts:["A material delivery schedule", "A list of subcontractors and their scheduled dates", "The colors and sheens for each room", "The order trades will work in"],ans:2,exp:"Finish schedule lists finishes by room/surface. Color, sheen, manufacturer, product. Painter's primary plan reference. Often includes a paint legend."},
{q:"An 'or equal' clause in a paint specification means:",opts:["Only the named product may be used", "A more expensive product must be used", "The cheapest available product may be used instead", "A substitute may be used if it truly equals it"],ans:3,exp:"'Or equal' = substitution allowed with approval. Submit comparable product specs showing equal or better performance. Doesn't mean any cheaper alternative — must truly equal."},
{q:"In new construction, painters typically apply primer:",opts:["After drywall is finished, before trim goes in", "Before the drywall is even installed on the framing", "After every other trade has finished", "As the very last step of the project"],ans:0,exp:"Sequence varies but commonly: drywall finished → primer → trim and fixtures → painter returns for topcoats → final touch-up at punch. Coordinate with general contractor."},
{q:"The contract scope of work should include:",opts:["Just the painter's name and license number on top", "The total price and payment due date", "The start date and crew size", "Surfaces, prep, products, coats, and exclusions"],ans:3,exp:"Detailed scope prevents disputes. Surfaces, prep, products, coats, color, mils, schedule, exclusions, payment terms. The more specific, the fewer arguments later."},
{q:"Lien rights protect:",opts:["Unpaid subcontractors and suppliers", "Government agencies that issue permits", "The homeowner, and no one else", "General contractors, but not subs"],ans:0,exp:"Mechanics liens give unpaid subs and suppliers a claim against the improved property. Strong remedy — but procedural, time-sensitive, and requires preliminary notice in California."},
{q:"A preliminary notice (or '20-day notice' in California) is:",opts:["Optional for every type of project", "Filed only once the project is complete and paid", "Required only on residential projects", "Required to keep lien rights, within 20 days"],ans:3,exp:"California preliminary notice: serve within 20 days of first furnishing work or materials. Without it, no lien rights for that work. Critical for subs not in direct contract with the owner."},
{q:"A 'notice of completion' filed by the owner:",opts:["Cancels the remaining contract", "Has no legal effect on anyone", "Shortens the deadline to file a lien", "Releases the contractor from warranty"],ans:2,exp:"Owner-filed notice of completion shortens the lien deadline (usually to 30 days for direct contractors, 60 days for others). If no notice, deadlines extend."},
{q:"Workers' compensation insurance for painting contractor employees is:",opts:["Provided by the state automatically", "Required only for full-time employees, not part-time", "Required for any contractor with employees", "Optional for small painting firms"],ans:2,exp:"California requires workers’ compensation (WC) for any employer. Operating without it = no license, criminal liability, no claim defenses. Even one employee triggers the requirement."},
{q:"General liability insurance for a painting contractor:",opts:["Is provided free through the contractor's bond", "Is required for every C-33 license, without exception", "Is provided by Cal/OSHA to licensed contractors", "Isn't required for most, but must be disclosed"],ans:3,exp:"CSLB does not require commercial general liability insurance for most licensees, though it strongly recommends it. Two exceptions to know: LLC licensees must carry $1–5 million in liability coverage, and home improvement contractors must disclose in writing whether they carry it (Business and Professions Code §7159.3). It protects against the inevitable: drips on furniture, a ladder through a window, a customer slip-and-fall."},
{q:"A contractor's bond for the C-33 (painting and decorating) license:",opts:["A replacement for liability insurance", "Paid each year to Cal/OSHA", "Required for a CSLB license", "Optional for small contractors"],ans:2,exp:"$25,000 contractor's bond required for CSLB licensure (as of recent years — verify current amount). Limited remedy for specific claim types. Not a replacement for liability insurance."},
{q:"A painting contractor's written contract with a homeowner for residential repaint must:",opts:["Be signed by the contractor only, not the owner", "Follow no specific requirements", "Be verbal for jobs under $5,000", "Meet CSLB rules on scope, price, and notices"],ans:3,exp:"Home Improvement contracts in California have specific requirements: down payment limits, mandatory notices, three-day right to cancel, etc. Tested heavily on the law and business exam."},
{q:"A contractor who performs work without a required license in California:",opts:["Faces penalties and may not be able to collect", "Gets a warning letter for a first offense, then a fine", "Faces no consequences if the work is good", "Can collect payment but not file liens"],ans:0,exp:"Unlicensed contracting = misdemeanor + administrative penalties + civil disgorgement of payments. The unlicensed contractor cannot sue to collect, and homeowners can recover all payments made."},
{q:"When a paint specification calls for a 4 mil dry film thickness system, the painter must:",opts:["Apply it at the spec and verify with gauges", "Skip checking if the painter is experienced", "Apply less paint to keep the cost down", "Apply extra paint just to be safe"],ans:0,exp:"Specs are contractual. Apply at spec, verify with gauges, document on industrial work. Application below spec = breach. Application above spec wastes material and can cause cracking."},
{q:"A paint warranty period is typically based on:",opts:["The retailer's return policy and nothing else", "Both the product and the labor warranty", "Whatever the buyer expects", "The painter's verbal promise alone"],ans:1,exp:"Two warranties: the manufacturer's product warranty (often 5–25 years for premium coatings) and the painter's workmanship warranty (typically 1–5 years). Different durations, different coverage. Customers often confuse them. Be clear in the contract about what your warranty covers."},
{q:"A walk-through with the owner at project completion:",opts:["Replaced by emailing photographs of each room", "Standard practice that leads to final payment", "Optional unless the owner insists", "Required only for commercial work"],ans:1,exp:"Walk-through is standard. Owner sees the work, identifies any concerns, signs off. Document with photos. Ties to final payment release. Skip it = disputes later."},
{q:"Final payment from the owner is typically:",opts:["Paid in full before work begins", "Due on the first day of work", "Optional at the owner's discretion", "Tied to completion and lien releases"],ans:3,exp:"Final payment held until punch list complete and lien releases received. Retention amount typically 5-10%. Released after warranty period in some commercial contracts."},
{q:"A general contractor working with a painting subcontractor:",opts:["Has no responsibility toward the painter", "Is the same person as the homeowner in every case", "Coordinates, provides access, and pays the sub", "Does all of the painting work itself"],ans:2,exp:"General contractor coordinates trades, manages site, pays per contract. Painter executes the painting scope. Clear roles in the subcontract avoid disputes."},
{q:"When working in occupied spaces, the painter should:",opts:["Coordinate with occupants and protect belongings", "Keep occupants out until the job is done", "Work around them without saying anything", "Charge extra for the inconvenience, unannounced"],ans:0,exp:"Occupied work needs communication. Occupants want to know: when, what rooms, smells, restoration of access. Plastic on belongings, ventilation, daily cleanup. Soft skills matter."},
{q:"A common scope item that painters should clarify in writing is:",opts:["How much prep, repair, and caulking is included", "Which brand of brushes and rollers the crew will use", "What time the crew takes its lunch break", "What color the company truck will be"],ans:0,exp:"Prep is the painter's biggest scope risk. Define in contract: 'minor caulking included; rotted wood replacement billed at $X/hr.' Otherwise the customer expects everything included."},
{q:"Color selection responsibility is typically:",opts:["Set in advance by the manufacturer", "The painter's, based on what sells best", "The general contractor's alone", "The owner's, confirmed by the painter"],ans:3,exp:"Owner picks colors; painter confirms in writing and gets approval before purchase. Apply color samples on actual wall. Avoid 'wrong color' callbacks — they're expensive."},
{q:"A color sample (mock-up) on the wall before full application is:",opts:["Required by Cal/OSHA on every job", "Standard practice before buying all the paint", "A waste of time on most jobs", "Optional, and only expected on large commercial work"],ans:1,exp:"Always sample on the actual wall in actual lighting. Color cards lie. Customers say 'too gray' or 'too warm' AFTER seeing it on the wall. Mock-up first, sign off, then proceed."},
{q:"When the painter encounters unforeseen conditions (e.g., extensive rot, unexpected lead paint), the appropriate action is:",opts:["Keep going and bill the owner for it afterward", "Keep going without telling anyone", "Stop, document, and propose a change order", "Skip the affected area without notice"],ans:2,exp:"Stop and document. Proposing a change order BEFORE doing the work protects payment and contract. Doing the work first then asking for payment = disputes."},
{q:"An air district permit for architectural painting is:",opts:["Generally not required; the product is regulated", "Required federally by the EPA", "Always required before any architectural painting starts", "Required for residential jobs only"],ans:0,exp:"Architectural coatings are regulated by the VOC limit on the product itself (South Coast's Rule 1113 and similar rules in other districts), not by project-by-project permits. Some industrial/shop operations do require permits — a different category."},
{q:"Photography of jobsite conditions and progress is:",opts:["Useful for documenting conditions and changes", "A waste of time on small residential jobs", "Required by Cal/OSHA on every job", "Prohibited inside a customer's home"],ans:0,exp:"Photos protect both parties. Pre-existing damage, prep level, change conditions, finished work. Time-stamped phone photos are legally valuable in disputes."},
{q:"A paint spec that calls for 'two coats of acrylic latex semi-gloss, 4 mils dry film thickness total':",opts:["Apply four coats of 1 mil each", "It is unclear and must be clarified", "Each of the two coats is 4 mils dry", "The two coats together total 4 mils dry"],ans:3,exp:"'Total' means combined system dry film thickness. Two coats × 2 mils each = 4 mils total. Specs that say 'each coat 4 mils' are different — read carefully."},
{q:"When a painter discovers an unsafe condition during work (e.g., damaged scaffold, uncontrolled lead exposure):",opts:["Ignore it if the job is almost done", "Stop and fix it, then resume when safe", "Keep working and report it later", "Speed up to finish before it fails"],ans:1,exp:"Stop-work authority is fundamental. Workers have the right (and often the duty) to refuse unsafe work. Address hazard before resuming."},
{q:"California's workplace safety agency (Cal/OSHA) Form 300 (Log of Work-Related Injuries and Illnesses) must be:",opts:["Kept by employers with 11+ employees", "Optional for any construction employer", "Submitted to the state every week", "Filed only after a fatality occurs"],ans:0,exp:"Form 300 = injury log. 11+ employees triggers the requirement. Annual summary (Form 300A (the posted annual summary)) posted Feb 1 to April 30. Cal/OSHA can demand on inspection."},
{q:"A jobsite safety meeting (toolbox talk):",opts:["A full replacement for formal training", "Meant only for brand-new workers on site", "Optional and rarely worthwhile", "Best practice that covers the day's hazards"],ans:3,exp:"Toolbox talks: brief daily/weekly safety discussions tied to that day's work. California IIPP (Injury and Illness Prevention Program) requires periodic safety communication. Document attendance."},
{q:"A painter who is asked to perform work outside their license classification (e.g., extensive drywall installation as a C-33 (painting and decorating)):",opts:["Just bill more, since any contractor can do it", "Check whether it needs a different license", "Refuse every job that includes it", "Do it without telling anyone"],ans:1,exp:"C-33 scope is painting and decorating. Extensive drywall = C-9 (drywall) territory. Exceeding scope = unlicensed contracting violations. Consult CSLB or take incidental work only when truly incidental."},
{q:"The standard surface burning test for interior finishes produces which two numbers?",opts:["Flame spread index and smoke developed index","Ignition temperature and burn duration","Heat release rate and oxygen index","Char depth and flame height"],ans:0,exp:"The test reports a flame spread index, which is how fast flame travels across the surface, and a smoke developed index, which is how much smoke the material produces. Both must be within limits."},
{q:"What is the flame spread index range for a Class A interior finish?",opts:["0 to 25","0 to 50","26 to 75","76 to 200"],ans:0,exp:"Class A is 0 to 25, the best performance. Class B is 26 to 75 and Class C is 76 to 200."},
{q:"What is the flame spread index range for a Class B interior finish?",opts:["0 to 25","26 to 75","76 to 200","201 to 500"],ans:1,exp:"Class B covers 26 to 75, sitting between Class A at 0 to 25 and Class C at 76 to 200."},
{q:"What is the flame spread index range for a Class C interior finish?",opts:["0 to 25","26 to 75","76 to 200","Above 200"],ans:2,exp:"Class C runs 76 to 200. Anything above 200 is not rated for use as an interior finish."},
{q:"What is the maximum smoke developed index permitted for Class A, B, and C interior finishes?",opts:["100","200","450","There is no smoke limit"],ans:2,exp:"The smoke developed index limit is 450 and it is the same for all three classes. A material can pass on flame spread and still fail on smoke."},
{q:"In the surface burning test, select-grade red oak flooring is assigned what flame spread index?",opts:["0", "25", "200", "100"],ans:3,exp:"Red oak is the upper reference point at 100, and fiber-cement board is the lower reference at 0. An index of 50 means flame travels about half as fast as across red oak."},
{q:"Which material serves as the zero reference point in the surface burning test?",opts:["Red oak flooring","Fiber-cement board","Gypsum wallboard","Plywood sheathing"],ans:1,exp:"Fiber-cement board is assigned a flame spread index of 0 because it essentially does not burn. Red oak is assigned 100."},
{q:"Which location in a building normally carries the strictest interior finish requirement?",opts:["Individual rooms and enclosed spaces","Exit access corridors","Exit stairways and exit passageways","Storage closets"],ans:2,exp:"The requirement tightens the closer you get to the way out. Exit stairways and passageways are the protected escape path and carry the strictest class."},
{q:"A building has an approved automatic sprinkler system. What effect does this typically have on the required interior finish class?",opts:["It has no effect on the class", "It can usually drop by one class", "It raises the requirement one class", "Only Class A is then permitted"],ans:1,exp:"With approved sprinklers the required class is generally permitted to drop one class, so Class A becomes B and Class B becomes C."},
{q:"What determines the interior finish class required for a given surface?",opts:["The color and sheen of the coating", "The occupancy and the location in the building", "The total square footage of the room or space", "The age and height of the building"],ans:1,exp:"Code tables cross-reference the occupancy group against the location, such as exit stairway, corridor, or room, with separate values for sprinklered buildings."},
{q:"A fire-retardant coating is rated Class A. On which surface does that rating apply?",opts:["Any surface it is applied to","Only the substrate it was tested over","Only metal surfaces","Only surfaces in sprinklered buildings"],ans:1,exp:"The rating belongs to the tested assembly, not to the can. A coating tested over one substrate does not carry that rating onto a different one."},
{q:"A painter stretches a fire-retardant coating to cover more area than the specified spread rate allows. What is the consequence?",opts:["Nothing, as long as the color is uniform", "The fire rating is void at that thinner film", "The coating dries faster and cures harder", "The smoke developed index improves"],ans:1,exp:"These products achieve their rating only at the specified thickness or spread rate. Applying thinner to save material destroys compliance even though the surface may look fine."},
{q:"What is the difference between a fire-retardant coating and an intumescent coating?",opts:["They are two names for the same product", "Retardant slows flame spread; intumescent swells to insulate", "Fire-retardant is for wood only; intumescent is for drywall only", "Intumescent goes on before primer; retardant after"],ans:1,exp:"Fire-retardant controls how the surface itself burns. Intumescent expands into an insulating char layer that protects the structure underneath, typically steel, delaying failure."},
{q:"An exit stairwell in an older building has been repainted many times over several decades. Why can this be a code concern?",opts:["The color no longer matches the original", "Thick paint buildup can raise flame spread", "The paint becomes too glossy for code", "Old paint always contains asbestos"],ans:1,exp:"Accumulated thick layers of ordinary paint can increase a surface's flame spread, which matters most in corridors and stairwells where the strictest class applies."},
{q:"How are intumescent fireproofing products typically specified?",opts:["By gloss level and color family", "By hourly fire rating and film thickness", "By gallons per square foot only", "By the number of coats applied over a primer"],ans:1,exp:"Intumescent coatings are specified by the hourly fire-resistance rating they must achieve and the dry film thickness required to reach it."},
]
};

const TC={surface_prep:'#7DA2FF',coatings:'#A78BFA',spray:'#34D3D3',brush_roller:'#FB9A4B',wallcoverings:'#D6A77A',safety_falls:'#F58BC8',safety_resp:'#F5C451',estimating:'#5AB8F5',failures:'#F97366',environmental:'#4FD1A5'};
const TL={surface_prep:'Surface Prep',coatings:'Coatings & Primers',spray:'Spray Application',brush_roller:'Brush & Roller',wallcoverings:'Wallcoverings',safety_falls:'Falls & Scaffolds',safety_resp:'Respirators & Lead',estimating:'Estimating & Math',failures:'Coating Failures',environmental:'Environmental & PM'};

// Line icons for each topic card (inner SVG paths, 24x24 stroke).
const TI={
  surface_prep:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
  coatings:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
  spray:'<path d="M3 3h.01M7 5h.01M11 7h.01M3 7h.01M7 9h.01M3 11h.01"/><rect x="15" y="5" width="4" height="4"/><path d="m19 9 2 2v10c0 .6-.4 1-1 1h-6c-.6 0-1-.4-1-1V11l2-2"/><path d="m13 14 8-2"/><path d="m13 19 8-2"/>',
  brush_roller:'<path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3Z"/><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"/>',
  wallcoverings:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/>',
  safety_falls:'<path d="M7 2v20"/><path d="M17 2v20"/><path d="M7 6h10"/><path d="M7 11h10"/><path d="M7 16h10"/>',
  safety_resp:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  estimating:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8"/><path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01"/><path d="M16 14v4"/>',
  failures:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  environmental:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>'
};

const ICON_CHECK='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_X='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
const ICON_ARROW='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';

// theme.css keys the bottom bar and phone spacing off this.
function setView(v){document.body.setAttribute('data-view',v);}

let cat='',pool=[],idx=0,score=0,answered=false,retryFn=null;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;}

// The four sections of the official C-33 exam and their approximate weights.
// A mixed exam draws from each group in proportion so practice matches the real thing.
const BLUEPRINT=[
  {pct:28, cats:['estimating','coatings','environmental']},   // Planning and Estimating
  {pct:30, cats:['surface_prep','failures']},                 // Substrate Repair and Surface Preparation
  {pct:21, cats:['spray','brush_roller','wallcoverings']},    // Application of Paint, Wallcoverings, Finishes
  {pct:21, cats:['safety_falls','safety_resp']},              // Safety
];

function blueprintExam(n){
  const out=[];
  BLUEPRINT.forEach(g=>{
    const bank=[];
    g.cats.forEach(c=>(Q[c]||[]).forEach(q=>bank.push({...q,cat:c})));
    out.push(...shuffle(bank).slice(0,Math.round(n*g.pct/100)));
  });
  return shuffle(out);
}

function startQuiz(c){
  cat=c;
  if(c==='all'){pool=blueprintExam(115);}
  // 'retest' is every question still on the missed list, worst first, so a
  // short session hits the weakest ones. 'retest:<cat>' narrows it to one topic.
  else if(c==='retest'||c.indexOf('retest:')===0){pool=CSLB.retestQuestions(c==='retest'?null:c.slice(7));}
  else{pool=shuffle(Q[c]).map(q=>({...q,cat:c}));}
  if(!pool.length){goHub();return;}
  // Randomize option positions so the correct answer isn't always in the same spot
  pool=pool.map(q=>{
    const tagged=q.opts.map((text,i)=>({text,correct:i===q.ans}));
    const shuf=shuffle(tagged);
    return {...q,opts:shuf.map(t=>t.text),ans:shuf.findIndex(t=>t.correct)};
  });
  idx=0;score=0;answered=false;
  document.getElementById('hub').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('quiz').style.display='block';
  setView('quiz');window.scrollTo(0,0);
  retryFn=()=>startQuiz(c);
  render();
}

function render(){
  answered=false;
  const q=pool[idx],total=pool.length;
  document.getElementById('prog-label').textContent=`${idx+1}/${total}`;
  document.getElementById('prog-fill').style.width=`${(idx/total)*100}%`;
  document.getElementById('score-chip').innerHTML=`<b>${score}</b> of ${idx} right`;
  const qcat=q.cat||cat;
  const tag=document.getElementById('q-tag');
  tag.textContent=TL[qcat]||qcat;tag.style.color=TC[qcat]||'#7DA2FF';
  tag.style.background=(TC[qcat]||'#7DA2FF')+'1a';
  document.getElementById('q-text').textContent=q.q;
  const opts=document.getElementById('q-options');
  opts.innerHTML='';
  ['A','B','C','D'].forEach((l,i)=>{
    const btn=document.createElement('button');
    btn.type='button';btn.className='opt';
    btn.innerHTML=`<span class="opt-letter">${l}</span><span class="opt-text">${q.opts[i]}</span>`;
    btn.onclick=()=>pick(i);
    opts.appendChild(btn);
  });
  document.getElementById('q-explanation').textContent='';
  document.getElementById('q-panel').classList.remove('show');
}

function pick(chosen){
  if(answered)return;
  answered=true;
  const q=pool[idx];
  document.querySelectorAll('.opt').forEach((btn,i)=>{
    btn.classList.add('revealed');
    const l=btn.querySelector('.opt-letter');
    if(i===q.ans){btn.classList.add('correct');l.innerHTML=ICON_CHECK;}
    else if(i===chosen){btn.classList.add('wrong');l.innerHTML=ICON_X;}
    else btn.classList.add('faded');
  });
  if(chosen===q.ans)score++;
  CSLB.record(q.__qid,q.cat||cat,chosen===q.ans);
  const exp=document.getElementById('q-explanation');
  exp.innerHTML=`<strong>Why</strong>${q.exp}`;
  const panel=document.getElementById('q-panel');panel.classList.add('show');
  document.getElementById('next-btn').innerHTML=(idx===pool.length-1?'See results':'Next question')+ICON_ARROW;
  document.getElementById('score-chip').innerHTML=`<b>${score}</b> of ${idx+1} right`;
  // On a phone the panel lands below the fold; bring it up.
  if(window.innerWidth<=760)panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function nextQuestion(){idx++;if(idx>=pool.length)showResults();else render();}

function showResults(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('results').style.display='block';
  setView('results');window.scrollTo(0,0);
  const total=pool.length,pct=Math.round((score/total)*100),pass=pct>=73;
  CSLB.recordAttempt(cat,total,score);
  const s=document.getElementById('res-score');s.textContent=`${pct}%`;s.className='result-score '+(pass?'pass':'fail');
  document.getElementById('res-label').textContent=pass?'Passing score. Nice work.':'Below 73%. Keep going.';
  document.getElementById('res-correct').textContent=score;
  document.getElementById('res-wrong').textContent=total-score;
  document.getElementById('res-total').textContent=total;
  document.getElementById('res-retry').onclick=retryFn;
}

function goHub(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('hub').style.display='block';
  setView('hub');
  CSLB.onHub();
}

// Hand the bank to progress.js, which owns the tracking, the topic page, the
// missed-question review, and the sync to D1.
CSLB.init({
  exam:'c33',
  bank:Q,
  labels:TL,
  colors:TC,
  icons:TI,
  passMark:73,
  examName:'Trade exam',
  fullCount:115,
  onStart:c=>startQuiz(c),
  onRetest:c=>startQuiz(c?'retest:'+c:'retest')
});
</script>
