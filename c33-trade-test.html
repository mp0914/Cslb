<script>
const Q={
surface_prep:[
{q:"A painter is hired to repaint the exterior of a 1962 home. Before starting any prep, the FIRST thing the painter must do is:",opts:["Estimate gallons and order materials for the job", "Find out whether lead paint is present before disturbing it", "Pressure wash the house to remove loose paint", "Spot prime any bare wood before it weathers"],ans:1,exp:"Pre-1978 housing is presumed to contain lead-based paint until tested otherwise. Before any prep that disturbs paint (scraping, sanding, power washing), the painter must determine lead status and follow lead-safe renovation rules — this is non-negotiable and a Contractors State License Board (CSLB) compliance issue."},
{q:"Steel to be painted is contaminated with oil and grease. What must be done before any wire brushing, sanding, or blasting?",opts:["Wire brush it first, then degrease", "Solvent clean to remove the oil and grease", "Prime directly over it to seal the contamination", "Rinse with plain water and allow to dry"],ans:1,exp:"Oil and grease must come off first, using solvent, emulsion, or steam. Mechanical cleaning over a greasy surface drives the contamination down into the profile and guarantees adhesion failure later."},
{q:"You must remove loose rust, mill scale, and flaking paint from a steel railing using hand tools only. What does that involve?",opts:["Wire brushes, scrapers, and hand sandpaper", "A needle gun, angle grinder, and power sander", "Low-pressure abrasive blasting", "Chemical stripper and a pressure washer"],ans:0,exp:"Hand tool cleaning means wire brushes, scrapers, and hand sanding. It takes off loose material but leaves tightly adhered mill scale in place, so it is the least thorough mechanical method."},
{q:"What is the main limitation of power tool cleaning compared with abrasive blasting?",opts:["It cannot remove loose rust or flaking paint", "It does not produce a true anchor profile", "It cannot be used on ferrous metal surfaces", "It requires the surface to be damp first"],ans:1,exp:"Power wire brushes, sanders, needle guns, and grinders remove considerably more than hand tools, but they do not cut a true anchor profile the way blasting does, which limits how well the coating can grip."},
{q:"An industrial steel specification permits light staining on no more than about one third of the surface after blasting. This level of cleaning is known as:",opts:["Brush-off blast", "Commercial blast", "Near-white blast", "White metal blast"],ans:1,exp:"Commercial blast removes essentially all contamination but tolerates light staining on up to about a third of the area. It is the common specification for general industrial steel work."},
{q:"Blast cleaning that leaves at least 95 percent of the surface free of all visible contamination is called:",opts:["Brush-off blast", "Commercial blast", "Near-white blast", "White metal blast"],ans:2,exp:"Near-white blast requires at least 95 percent of the area to be free of visible residue. It sits one step below white metal blast and is specified where service conditions are severe."},
{q:"A steel tank will be placed in immersion service. What level of surface cleaning is normally required?",opts:["Brush-off blast", "Commercial blast", "Near-white blast", "White metal blast"],ans:3,exp:"Immersion is the most demanding service condition and normally calls for white metal blast, meaning 100 percent removal of all visible contamination. It is also used for marine and military work."},
{q:"New galvanized steel that has not weathered should be primed with:",opts:["Shellac-based primer under a latex topcoat", "Oil-based alkyd rust-inhibitive primer", "A latex topcoat applied with no primer", "Direct-to-metal acrylic or zinc-rich primer"],ans:3,exp:"Alkyd (oil-based) primers SAPONIFY on zinc — the alkali in the zinc reacts with the ester linkages in the alkyd binder, producing a soap-like film. Always use direct-to-metal acrylic or zinc-rich primer on galvanized."},
{q:"Saponification on alkyd paint over zinc or fresh concrete is caused by:",opts:["Ultraviolet light breaking down the alkyd binder", "Applying the alkyd below its minimum temperature", "Alkali in the substrate attacking the alkyd binder", "Solvent from the topcoat softening the alkyd film"],ans:2,exp:"Saponification = alkali + alkyd ester linkage = soap. The reaction produces a soft, sticky film that loses adhesion. Use alkali-resistant primers (acrylic, masonry primer, epoxy) on alkali substrates instead."},
{q:"The MAXIMUM moisture content for most wood substrates before painting is approximately:",opts:["35%", "5%", "15%", "25%"],ans:2,exp:"Wood moisture should be at or below ~15% before painting. Above that, expect blistering, peeling, and adhesion failure as moisture migrates through the coating."},
{q:"New concrete should typically cure for approximately how long before applying most architectural coatings:",opts:["28 days", "90 days", "14 days", "7 days"],ans:0,exp:"28 days is the standard cure window for concrete before most coatings. Earlier coating risks high alkalinity, residual moisture, and saponification with alkyd products. Always test moisture before coating."},
{q:"A painter encounters chalking on a previously painted exterior surface. After washing and rinsing, residual chalk remains. The BEST primer choice is:",opts:["A shellac-based stain-blocking primer", "The latex topcoat thinned as its own primer", "A bonding primer designed for chalky surfaces", "A high-build block filler applied by roller"],ans:2,exp:"Residual chalk = adhesion problem. A chalk-stop or bonding primer is formulated to penetrate residual chalk and lock it down. Standard primers will fail on chalky surfaces."},
{q:"Efflorescence on masonry MUST be:",opts:["Removed, and the moisture source found and fixed", "Sealed under an elastomeric coating to lock it in", "Left alone if the deposits are light and dry", "Primed over with a high-build masonry primer"],ans:0,exp:"Efflorescence = soluble salts brought to the surface by moisture. Remove the deposits (dry brushing or a mild acid wash), then find and correct the moisture source. Sealing it in just guarantees repeat failure as the moisture continues migrating."},
{q:"Mildew on a previously painted surface should be:",opts:["Sanded off with 80-grit paper, then spot primed", "Covered with a mildew-resistant topcoat to stop growth", "Killed with bleach or a mildewcide, rinsed, then primed", "Sealed in under a coat of oil-based stain blocker"],ans:2,exp:"Mildew is alive. Painting over it just feeds it. Always kill it first (3:1 water-to-bleach or commercial mildewcide), rinse thoroughly, allow to dry, THEN prime and topcoat."},
{q:"The CORRECT order for prepping previously painted exterior wood is:",opts:["Topcoat \u2192 sand \u2192 wash \u2192 prime", "Caulk \u2192 wash \u2192 scrape \u2192 prime \u2192 topcoat", "Sand \u2192 wash \u2192 scrape \u2192 spot prime \u2192 caulk \u2192 topcoat", "Wash \u2192 scrape \u2192 sand \u2192 spot prime \u2192 caulk \u2192 topcoat"],ans:3,exp:"Wash FIRST so you don't sand contamination into the wood. Spot prime bare wood BEFORE caulking so the caulk has a sealed surface to bond to. This is the canonical exterior repaint sequence."},
{q:"Caulking is performed AFTER spot priming bare wood because:",opts:["It keeps the primer from cracking at the caulk joint", "Caulk can only be applied over a latex coating", "Manufacturer specifications require it for warranty", "The caulk requires a sealed surface to bond properly"],ans:3,exp:"Bare wood absorbs moisture and oils — caulk applied directly to bare wood pulls away as the wood absorbs the binder. Spot prime first, then caulk into a sealed substrate."},
{q:"A water-stained drywall ceiling, after the leak has been repaired and the drywall has dried, should be:",opts:["Sanded smooth and topcoated with ceiling paint", "Cut out and replaced, regardless of stain size", "Painted with two full coats of latex ceiling paint", "Spot primed with a shellac or oil stain blocker"],ans:3,exp:"Latex won't block water stains — they bleed through. Shellac is the gold standard for water, smoke, tannin, and odor stains. Spot prime the affected area, then proceed with regular finish."},
{q:"Tannin bleed is most common with:",opts:["Birch and walnut", "Oak and maple", "Pine and Douglas fir", "Cedar and redwood"],ans:3,exp:"Cedar and redwood are the classic tannin bleeders. Tannins migrate through paint as brownish stains. Block with a stain-blocking primer (shellac or oil-based stain blocker)."},
{q:"When a painter discovers soft, water-damaged wood under the paint film, the correct action is:",opts:["Seal it with an oil-based primer", "Build it up with a thicker topcoat", "Cut out and replace the damaged wood", "Fill the surface with exterior caulk"],ans:2,exp:"Soft, rotted wood is structural failure — coatings cannot restore integrity. Cut out the damage, replace with sound wood, prime all six sides if possible, then proceed."},
{q:"Glossy oil-based trim that will receive a waterborne topcoat must FIRST be:",opts:["Deglossed and primed with a bonding primer", "Stripped completely to bare wood first", "Painted directly with the waterborne topcoat", "Wiped with water and coated with shellac"],ans:0,exp:"Latex over glossy oil = peeling. Create profile (sand or chemically degloss), then use a bonding primer designed for slick surfaces. This is one of the most common failure modes."},
{q:"When sanding lead-based paint on a pre-1978 home, the dust must be:",opts:["Collected with a HEPA vacuum and wet wiped", "Swept up with a broom and bagged", "Blown off with compressed air outdoors", "Left in place if the work is outdoors"],ans:0,exp:"Brooms and compressed air aerosolize lead dust, and both are prohibited under the lead-safe renovation rule. A high-efficiency particulate air (HEPA) vacuum plus wet wiping is the required method. Wet methods reduce airborne dust."},
{q:"Pre-1978 home interior, painter is disturbing 8 sq ft of painted surface. Lead-safe renovation rule rules:",opts:["Apply only if children under 6 live in the home", "Apply, since it exceeds the interior threshold", "Do not apply, because the work is under 10 sq ft", "Apply only if the homeowner requests it in writing"],ans:1,exp:"Interior threshold is 6 sq ft. Disturbing 8 sq ft exceeds it, so the full lead-safe renovation rule applies: certified renovator, containment, high-efficiency particulate air (HEPA), lead-safe practices, cleanup verification."},
{q:"Pre-1978 home exterior, painter is disturbing 15 sq ft of painted surface. Lead-safe renovation rule rules:",opts:["Apply, since any pre-1978 exterior work is covered", "Apply only if the homeowner is present on site", "Apply, because it exceeds the 10 sq ft exterior limit", "Do not apply, since it is under the exterior threshold"],ans:3,exp:"Exterior threshold is 20 sq ft. 15 sq ft is below the threshold, so lead-safe renovation rule does not apply for that specific work. Best practice still uses safe methods."},
{q:"Surface temperature during painting must be at least how many degrees above the dew point:",opts:["10\u00b0F", "5\u00b0F", "1\u00b0F", "20\u00b0F"],ans:1,exp:"Surface temp must be at least 5\u00b0F above the dew point during application AND through cure. If surface drops below dew point, condensation forms under the film causing blisters and adhesion failure."},
{q:"Most standard latex paints have a minimum surface application temperature of approximately:",opts:["70\u00b0F", "90\u00b0F", "50\u00b0F", "32\u00b0F"],ans:2,exp:"Standard latex needs 50\u00b0F minimum surface temp to form a proper film. Below that, the binder won't coalesce and the film cracks/fails. Low-temp formulations go down to ~35\u00b0F."},
{q:"Low-temperature latex paints can typically be applied down to approximately:",opts:["0\u00b0F", "35\u00b0F", "65\u00b0F", "55\u00b0F"],ans:1,exp:"Low-temp latex formulations are engineered to coalesce at lower temperatures, typically down to 35\u00b0F surface temp. Verify on the technical data sheet \u2014 varies by manufacturer."},
{q:"A painter uses a moisture meter on exterior wood and reads 22%. The painter should:",opts:["Wait until it dries to about 15% or below", "Paint now; up to 25% is acceptable for exterior wood", "Apply oil primer to seal the moisture into the wood", "Apply an elastomeric coating that lets the wood breathe"],ans:0,exp:"22% is too wet to paint. Painting now traps moisture under the film and causes blistering and peeling within months. Wait for the wood to dry to ≤15%."},
{q:"A painter pressure washes exterior siding. Recommended pressure for wood siding is approximately:",opts:["100–300 PSI", "As high as the machine will go", "3,500–4,500 PSI", "1,500–2,500 PSI"],ans:3,exp:"Wood damages easily under high pressure. Use moderate pressure (1,500–2,500 PSI typical) and a wider fan tip. Masonry tolerates higher pressure; wood does not."},
{q:"New ferrous metal that has flash rusted before priming should be:",opts:["Re-cleaned to bright metal and primed right away", "Left to weather until the rust layer stabilizes", "Primed as-is to lock the rust under the film", "Sealed with a latex primer to stop the rust"],ans:0,exp:"Flash rust = active corrosion. Coating over it traps the rust to continue undermining the film. Re-clean to spec and prime immediately while the surface is bright."},
{q:"The PRIMARY reason for sanding glossy or non-porous surfaces before priming is:",opts:["To give the primer tooth to grip", "To remove most of the old paint", "To even out the color of the surface", "To reduce how much primer it absorbs"],ans:0,exp:"Profile = mechanical bite. Without it, the new coating sits on top of the slick surface and peels. Sand or chemically degloss to create tooth before priming."},
{q:"A cross-hatch tape test (ASTM D3359) is used to:",opts:["Test how well a coating adheres", "Measure the sheen level of a finish", "Measure dry film thickness in mils", "Measure moisture content in the substrate"],ans:0,exp:"ASTM D3359 cuts a # pattern through the coating, applies tape, pulls. Rate adhesion 0–5. Standard test for evaluating whether existing coatings will hold a recoat."},
{q:"Block filler is applied to:",opts:["Bare wood, to fill the open grain", "New drywall, to fill the paper texture", "Concrete block, to fill its pinholes", "Smooth metal, to build film thickness"],ans:2,exp:"Block filler is a thick-bodied primer specifically designed to fill the pinholes/pores in concrete block. Without it, topcoats look pitted and porous. Apply by brush, roll, or spray and back-roll."},
{q:"A painter encounters fresh concrete that is 14 days old and needs to be coated. The painter should:",opts:["Force-cure it with heaters, then coat", "Wait about 28 days and test for moisture", "Coat it now with a breathable latex primer", "Coat it now with an oil-based primer"],ans:1,exp:"14 days is too early for most coatings. Concrete continues curing — high alkalinity and moisture cause adhesion failure. Wait to ~28 days and verify with moisture testing."},
{q:"Pre-1978 housing is presumed to contain lead-based paint UNLESS:",opts:["The home was sold after 1978", "The homeowner verbally states it doesn't", "The paint smells like latex", "A certified lead test confirms otherwise"],ans:3,exp:"Lead paint was banned for residential use in 1978. Pre-1978 = presumed lead until proven otherwise by certified test. No verbal claim or sale date overrides the testing requirement."},
{q:"Smooth concrete block that will be painted with high-gloss topcoat requires which FIRST coat:",opts:["A thinned coat of the latex topcoat", "Block filler to fill pinholes", "An oil-based enamel undercoater", "A shellac-based sealer"],ans:1,exp:"Concrete block has thousands of pinholes that destroy a smooth topcoat. Block filler first, then primer, then topcoat. Skipping block filler results in a pitted, porous-looking finish."},
{q:"A 1985 home with bare wood window trim shows water damage. After replacing the damaged wood, the painter should:",opts:["Prime all bare wood before the topcoat", "Skip primer, since the new wood is pre-finished", "Apply the latex topcoat directly", "Caulk the joints and leave the wood bare"],ans:0,exp:"Bare wood needs primer for adhesion, sealing, and tannin/stain blocking. Priming all sides where possible prevents moisture entry from cut ends and back faces."},
{q:"Powdery residue that comes off on a dark cloth when rubbed across a previously painted exterior is:",opts:["Chalking", "Mildew", "Saponification", "Efflorescence"],ans:0,exp:"Chalking is normal weathering — UV breaks down the binder, leaving pigment as a powdery residue. Heavy chalking = poor binder or extended exposure. Wash off and use bonding primer if residual."},
{q:"Mildew can be distinguished from dirt by:",opts:["Its color: mildew is always green, dirt is brown", "A heat test: mildew darkens when warmed, dirt does not", "Water alone: mildew dissolves, dirt does not", "A drop of bleach: mildew lightens, dirt does not"],ans:3,exp:"Bleach solution test is the standard. Mildew is fungus and lightens when bleached. Dirt won't change color. Use diluted bleach (3:1 water-to-bleach) and rinse thoroughly."},
{q:"Aluminum substrates are best prepared with:",opts:["A latex topcoat applied directly to the metal", "Solvent cleaning, then a self-etching primer", "Sanding, then a shellac-based stain-blocking primer", "An oil-based primer over the surface as found"],ans:1,exp:"Aluminum has a passive oxide layer that resists adhesion. Solvent clean, then etch with phosphoric acid or use a self-etching primer. Direct-to-metal acrylic also works well on properly prepared aluminum."},
{q:"Wet abrasive blasting is sometimes preferred over dry blasting because:",opts:["It cuts a deeper anchor profile", "It greatly reduces airborne dust", "It removes the need for a primer", "It works faster than dry blasting"],ans:1,exp:"Wet blasting injects water into the abrasive stream, dramatically reducing airborne dust. Required or preferred for lead-paint removal, near occupied spaces, and for silica control."},
{q:"A painter discovers that paint scraped from a home built in 1973 may contain lead. The minimum required action is:",opts:["Keep scraping, but mist the debris with water", "Tell the homeowner, then continue scraping", "Finish scraping, then bag and trash the debris", "Stop and test for lead, or assume it is present"],ans:3,exp:"Pre-1978 = assume lead until tested. Continuing without protection violates lead-safe renovation rule and exposes workers and occupants to lead poisoning. Stop and follow proper procedure."},
{q:"New drywall should be primed with:",opts:["A thick block filler, back-rolled", "Polyvinyl acetate (PVA) drywall primer", "A shellac-based stain-blocking primer", "An oil-based enamel undercoater"],ans:1,exp:"Polyvinyl acetate primer (or a high-build drywall primer) equalizes porosity between the paper face and the joint compound. Without it, mud and paper absorb topcoat differently — visible 'flashing' across the wall."},
{q:"'Flashing' of a finished wall (visible difference in sheen and color) is caused by:",opts:["Changing sunlight during application", "Using rollers with different nap lengths", "Low humidity in the room", "Uneven porosity under the paint"],ans:3,exp:"Flashing = porosity mismatch. Spot-primed patches absorb topcoat differently than the rest of the wall, producing visible sheen and color variation. Prime the entire surface to even it out."},
{q:"Removing failing paint from a 1955 home requires:",opts:["Following EPA lead-safe renovation rules", "Any method, as long as debris is bagged", "Notifying the homeowner before starting", "Using chemical strippers instead of scraping"],ans:0,exp:"Pre-1978 home + paint disturbance = full lead-safe renovation rule. Containment, HEPA vacuum, wet methods, certified worker, cleanup verification, recordkeeping. Not optional."},
{q:"Soft, spongy wood with active rot:",opts:["Hardens once it is primed and painted", "Can be sealed in with elastomeric", "Can be soaked with epoxy and painted", "Must be cut out and replaced"],ans:3,exp:"Rot is structural failure. Wood hardener and epoxy fillers can stabilize MINOR damage, but soft, active rot must be cut out and replaced. No coating restores structural integrity."},
{q:"Calcium chloride moisture testing on concrete typically requires the result to be below approximately:",opts:["1 lb per 1,000 sq ft per 24 hr", "15 lb per 1,000 sq ft per 24 hr", "50 lb per 1,000 sq ft per 24 hr", "3–5 lb per 1,000 sq ft per 24 hr"],ans:3,exp:"Most coatings require ≤4 lb (sometimes up to 5 lb) of moisture vapor emission per 1,000 sq ft per 24 hr via calcium chloride testing. Verify the specific coating's technical data sheet for its limit."},
{q:"Power washing pre-1978 painted surfaces is:",opts:["Allowed at any pressure if the home is vacant", "The fastest legal way to remove loose paint", "Prohibited at high pressure without containment", "Required by Cal/OSHA before any scraping begins"],ans:2,exp:"Unrestricted power washing aerosolizes lead-contaminated water and paint chips. Lead-safe renovation rule prohibits high-pressure washing without containment in pre-1978 housing. Use lower pressure with capture or alternative methods."},
{q:"A coating's long-term adhesion depends MOST on:",opts:["Time of day applied", "Surface preparation", "Application speed", "Topcoat brand"],ans:1,exp:"90% of coating failures trace to prep. Brand, application speed, and timing matter \u2014 but they're secondary to clean, dry, properly profiled substrate. Master prep and you've half-passed the exam."},
{q:"The 'tooth' or profile of a sandblasted steel surface is measured in:",opts:["PSI", "Grit numbers", "Percent of surface", "Mils"],ans:3,exp:"Profile depth is measured in mils (0.001\"). Most coatings spec a profile range (e.g., 1.5–3 mil profile). Measured with profile gauges or replica tape per ASTM standards."},
{q:"A painter discovers that a previously coated surface fails the cross-hatch tape test (paint pulls off). The correct action is:",opts:["Apply a bonding primer over the failing paint", "Topcoat it, since the new paint will bind it", "Apply a heavier topcoat to hold it down", "Strip it back to a sound surface first"],ans:3,exp:"Failed adhesion = the existing system is not bonded. Topcoating over it just adds weight to a failing system that will peel together. Strip to sound substrate and rebuild."},
{q:"When prepping a stucco wall with hairline cracks, the painter should:",opts:["Leave them, since they are only cosmetic", "Sandblast the wall to open the cracks", "Fill or bridge them with elastomeric products", "Apply a standard latex topcoat over them"],ans:2,exp:"Hairline cracks let water in and grow. Either fill with elastomeric caulk or use an elastomeric topcoat designed to bridge them. Standard latex won't bridge — cracks telegraph through."},
{q:"A 1990 home does NOT require lead-safe renovation rule compliance because:",opts:["The rule only covers multi-family housing", "The rule only covers commercial buildings", "The rule only covers homes built before 1960", "The rule only covers housing built before 1978"],ans:3,exp:"1978 is the federal cutoff — lead-based paint was banned for residential use that year. Homes built 1978 or later are exempt from lead-safe renovation rule for lead reasons (other regs may apply)."},
{q:"When repainting an exterior previously coated with elastomeric, the painter should:",opts:["Strip the whole surface back to bare stucco", "Use a coating the manufacturer says bonds to it", "Apply an oil-based topcoat over the elastomeric", "Prime it with shellac, then use any latex"],ans:1,exp:"Elastomeric is a thick, flexible film. Most coatings won't adhere well to it. Confirm compatibility with the manufacturer or stick with elastomeric/acrylic systems designed for it."},
{q:"A painter feathers the edges of scraped paint with sandpaper PRIMARILY to:",opts:["Build up film thickness at the edges", "Help the primer soak into the old paint", "Hide the edges so they don't show through", "Speed up drying of the next coat"],ans:2,exp:"Scraped edges create visible ridges that telegraph through the topcoat. Feather sanding tapers the edge to invisible. Without it, the finish looks like a relief map of every old paint chip."},
{q:"When painting over an unknown previous coating, the painter should:",opts:["Test a small area for compatibility and adhesion", "Always strip it to bare substrate first", "Cover it with a bonding primer and skip testing", "Use only oil-based products over unknown coatings"],ans:0,exp:"Unknown coating = unknown chemistry. Test a small inconspicuous area for both compatibility (no lifting) and adhesion (cross-hatch) before committing to the whole job."},
{q:"Which drop cloth material should never be walked on?",opts:["Canvas","Plastic sheeting","Paper with poly backing","Rosin paper"],ans:1,exp:"Plastic is slippery underfoot and paint stays wet on its surface. It is for covering furniture and fixtures, not for floors people walk across."},
{q:"Which drop cloth is the best general choice for floors and walkways?",opts:["Plastic sheeting","Canvas","Newspaper","Aluminum foil"],ans:1,exp:"Canvas absorbs spills, lies flat without sliding, and is reusable, making it the standard for floor and walkway protection."},
{q:"What is the approximate clean-removal window for standard blue painter's tape?",opts:["About 24 hours","About 14 days","About 60 days","About 6 months"],ans:1,exp:"Blue painter's tape is generally rated for clean removal at around 14 days. Delicate-surface tapes extend to roughly 60 days, and general-purpose masking tape is only 1 to 3 days."},
{q:"Which tape should be used over freshly painted surfaces or delicate finishes?",opts:["General-purpose tan masking tape", "Green high-adhesion painter's tape", "Low-tack delicate-surface tape", "Blue multi-surface painter's tape"],ans:2,exp:"Delicate-surface tape, often purple or yellow, uses low-tack adhesive designed not to lift fresh paint, wallcovering, or faux finishes."},
{q:"Paint bleeds under the tape line despite careful application. What is the most likely cause?",opts:["The tape was a premium, high-tack grade", "The tape edge wasn't pressed down firmly", "The tape was applied too soon before painting", "The wall color was darker than the trim"],ans:1,exp:"Tape must go on a clean, dry surface with the edge pressed firmly down. Dust under the edge, or an unburnished edge, is what lets paint creep through."},
{q:"When is the best time to remove masking tape from a painted edge?",opts:["After the paint has fully cured for several days", "While the paint is still slightly soft", "Right after the first brush stroke, before finishing", "Only after a second coat has been applied over it"],ans:1,exp:"Fully cured paint bridges the tape edge and tears when the tape is pulled. Remove while still slightly soft, or score the line first, pulling back at about 45 degrees."},
{q:"Why should masking tape not be left on a surface in direct sun?",opts:["The color fades and it becomes hard to see", "The adhesive bakes on and can pull off the finish", "It attracts dust that falls onto the wet paint", "It shrinks in the heat and distorts the paint line"],ans:1,exp:"Heat and ultraviolet exposure cure the adhesive onto the surface, making the tape difficult to remove and likely to take finish with it."},
{q:"When practical, what is usually better than masking hardware such as switch plates and door handles?",opts:["Painting over them","Removing them entirely","Covering them with newspaper","Applying two layers of tape"],ans:1,exp:"Removing hardware is normally faster than masking it and produces a cleaner result with no tape lines or bleed."},
{q:"Why does spray application require substantially more masking than brush and roller work?",opts:["Sprayed coatings are more corrosive to trim", "Overspray drifts far past the target surface", "Spray hoses and fittings tend to leak paint", "Sprayed paint dries too slowly to wipe off"],ans:1,exp:"Atomized coating travels on air currents far past the target surface, so masking must extend well beyond the immediate work area."},
{q:"What is the practical wind limit for outdoor spray application?",opts:["About 5 miles per hour","About 10 to 15 miles per hour","About 25 miles per hour","Wind has no effect on spraying"],ans:1,exp:"Above roughly 10 to 15 miles per hour, overspray carries unacceptably far and the finish quality degrades. Check wind direction before starting."},
{q:"On an exterior repaint, which of these is most often overlooked during masking?",opts:["The front door and its hardware", "Neighboring vehicles and landscaping", "Windows on the side being painted", "Interior floors near the entry"],ans:1,exp:"Overspray readily reaches vehicles, plants, and walkways beyond the property line. These are among the most common and most expensive overspray claims."},
{q:"What must be true of a surface before masking tape is applied?",opts:["It must be slightly damp","It must be clean and dry","It must be freshly primed","It must be warm to the touch"],ans:1,exp:"Tape only seals properly to a clean, dry surface. Dust, moisture, or chalk under the tape guarantees bleed."},
],
coatings:[
{q:"A coating's binder primarily determines:",opts:["The color, hiding power, and tint strength of the paint", "Only how fast the paint dries to touch", "The film's adhesion, durability, and flexibility", "The viscosity in the can and nothing else"],ans:2,exp:"The binder is the resin that forms the film when paint cures. It dictates virtually all performance properties. Choose coatings by matching binder chemistry to the substrate and environment."},
{q:"100% acrylic latex paint compared to vinyl-acrylic blend offers:",opts:["Faster dry time but no other real advantage", "Lower VOC content at the same durability", "Better adhesion, durability, and color retention", "A lower price per gallon for similar results"],ans:2,exp:"100% acrylic outperforms vinyl-acrylic on every long-term metric. Worth the price upgrade for exterior and high-traffic interior. Vinyl-acrylic is fine for low-traffic interior only."},
{q:"Alkyd (oil-based) paint compared to acrylic latex generally has:",opts:["Lower VOC and easier soap-and-water cleanup", "Better UV stability with less yellowing", "Faster drying and better flexibility over time", "Better flow and a harder film, but higher VOC"],ans:3,exp:"Alkyds have classic 'oil paint' attributes — beautiful flow, hard film, great penetration. Trade-offs are higher VOCs, slow dry and cure, mineral spirits cleanup, yellowing over time, and saponification on alkali substrates."},
{q:"A two-component epoxy is BEST suited for:",opts:["Exterior wood siding that needs to flex", "Long-term exterior roof coatings in full sun", "Industrial floors and chemical-exposure areas", "Interior trim that will be brushed by hand"],ans:2,exp:"Epoxies = chemical resistance, abrasion resistance, adhesion to metal and concrete. Industrial floor coating is the textbook use. ultraviolet (UV) exposure causes chalking — not for exterior topcoats."},
{q:"The PRIMARY weakness of epoxy coatings in exterior applications is:",opts:["It chalks and fades in sunlight", "It costs more than most topcoats", "It adheres poorly to steel", "It cures too slowly outdoors"],ans:0,exp:"Epoxies break down under UV — chalk, fade, lose gloss. Use them as primers under UV-stable urethane topcoats, or in shaded/interior applications. Not suitable as exterior topcoats."},
{q:"Aliphatic urethane is preferred over aromatic urethane for exterior topcoats because:",opts:["It can be applied with no primer", "It costs less than aromatic urethane", "It holds gloss and color in sunlight", "It dries and cures faster outdoors"],ans:2,exp:"Aliphatic = UV-stable. Aromatic = chalks like epoxy. Marine, commercial, and high-end exterior topcoats use aliphatic urethane to retain color and gloss for decades."},
{q:"Shellac-based primer is BEST used for:",opts:["Priming large areas of new drywall before topcoat", "Sealing fresh, high-pH concrete", "Priming exterior masonry walls", "Blocking water, smoke, and tannin stains"],ans:3,exp:"Shellac primers (BIN-style) are unmatched for blocking water stains, smoke damage, tannin bleed, and odors. Alcohol-based, fast dry, interior-only. The gold standard for problem stains."},
{q:"A self-priming exterior paint:",opts:["Cannot be tinted to deep colors", "Eliminates priming on bare wood and rust", "Still needs spot priming on problem areas", "Outlasts a separate primer and topcoat"],ans:2,exp:"Self-priming = good build, OK adhesion to sound substrates. But bare wood, rust, stains, tannin still need spot priming. Marketing implies otherwise — exam tests whether you know better."},
{q:"Block filler is designed to:",opts:["Bond new paint to oily surfaces", "Replace primer on smooth poured concrete", "Fill the pinholes in concrete block", "Patch large cracks in stucco walls"],ans:2,exp:"Block filler is a thick-bodied first coat for concrete masonry units. Fills the thousands of pinholes that would otherwise show through topcoat as a pitted, porous surface."},
{q:"A direct-to-metal (Direct-to-Metal) coating:",opts:["Cannot be used on steel or other ferrous metals", "Is made for aluminum and no other metals", "Always requires a separate metal primer first", "Bonds to prepared metal without a separate primer"],ans:3,exp:"Direct-to-metal products combine primer and topcoat properties for metal. Save labor on light-duty applications. Heavy-duty industrial work still typically uses separate primer + topcoat."},
{q:"When mixing a two-component epoxy, 'pot life' refers to:",opts:["How long it stays usable after mixing", "How long it takes to fully cure", "How long the unmixed kit lasts on the shelf", "How long you have to apply the next coat"],ans:0,exp:"Pot life = window after mixing during which the material remains workable. After pot life, viscosity rises, the material is unworkable, and it must be discarded. Mix small batches you can use."},
{q:"A two-component coating past its pot life should be:",opts:["Warmed up to extend its working time", "Sealed and stored for use the next day", "Discarded, since solvent won't restore it", "Thinned with solvent and used right away"],ans:2,exp:"Past pot life, the cross-linking has progressed and the chemistry is committed. Solvent doesn't reverse this — it just produces a weaker, defective film. Throw it out."},
{q:"A zinc-rich primer protects steel by:",opts:["Sealing out moisture with a thick barrier", "Blocking UV light from reaching the steel", "Sacrificing itself: the zinc corrodes first", "Neutralizing rust with a chemical converter"],ans:2,exp:"Zinc is more reactive than steel. When the film is breached, the zinc corrodes first, protecting the steel underneath — same principle as galvanizing. Used on industrial and marine steel."},
{q:"Intumescent coatings:",opts:["Block water and smoke stains on interiors", "Reduce VOC emissions on industrial jobs", "Add a bright color coat to structural steel", "Swell into an insulating char in a fire"],ans:3,exp:"Intumescent = expands when heated. Forms a thick char layer that insulates the steel from fire, delaying structural failure. Specified by fire rating (1-hr, 2-hr) and dry film thickness must be exact."},
{q:"Anti-graffiti coatings:",opts:["Cure faster than standard topcoats", "Dissolve graffiti on their own over time", "Are required on all commercial buildings", "Let graffiti be cleaned off without damage"],ans:3,exp:"Two flavors: sacrificial wax (cheap, must be reapplied after each cleaning) and permanent fluoropolymer (expensive, lasts decades). Both let graffiti be cleaned off without substrate damage."},
{q:"Elastomeric coatings are characterized by:",opts:["Low cost and a short service life outdoors", "A thin film with a high-gloss finish", "High build and high stretch to bridge cracks", "Solvent-based formulas with no water versions"],ans:2,exp:"Elastomeric = thick + flexible: high build (often 10–20 mils dry film thickness) and high elongation. Designed for stucco/masonry to seal hairline cracks and stretch with substrate movement. Apply at the manufacturer's spec mil thickness."},
{q:"Elastomeric coating is generally NOT recommended on:",opts:["Stucco", "Concrete block", "Brick", "Wood"],ans:3,exp:"Wood needs to breathe. Thick elastomeric traps moisture inside the wood, causing rot. Use on masonry/stucco where the substrate doesn't move with humidity."},
{q:"A high-PVC (above critical pigment volume concentration (PVC)) coating produces:",opts:["A glossy, hard, scrub-resistant finish", "A flat, porous, less durable finish", "The same finish as a low-PVC coating", "A satin finish with extra stain resistance"],ans:1,exp:"Critical PVC (CPVC) is the inflection point. Below CPVC = glossy, hard, durable. Above CPVC = flat, porous, breathable, less durable. Common in flat ceiling paints and masonry primers."},
{q:"Pigment Volume Concentration (PVC) is:",opts:["The coating's volatile organic compound content", "The amount of plastic resin in the can", "Pigment volume as a share of pigment plus binder", "The pH of the coating, which affects stability"],ans:2,exp:"PVC = pigment volume ÷ (pigment + binder volume), expressed as a percentage. Determines whether the finish is glossy/hard or flat/porous depending on whether it's above or below critical PVC."},
{q:"Recoat windows on a coating's technical data sheet exist because:",opts:["Too soon traps solvent; too late hurts adhesion", "They only matter for oil-based products", "They control how the final color and sheen develop", "They are mostly a warranty formality"],ans:0,exp:"Recoat windows aren't arbitrary. Too soon = solvent trap, lifting. Too late = the coating cures fully and the next layer can't bite in. Read the technical data sheet for every product."},
{q:"A 100% silicone topcoat is generally used for:",opts:["Roof waterproofing, though it is hard to recoat", "Exterior wood doors that need flexibility", "Interior trim that gets frequent touch-ups", "Walls that will be repainted again soon"],ans:0,exp:"Silicone is excellent for waterproofing — but almost nothing adheres to cured silicone. Don't use it where future repaint is expected. Once silicone is on, you're committed."},
{q:"Boxing paint refers to:",opts:["Mixing several cans together for one even color", "Storing paint in a temperature-controlled box", "Wrapping open cans in plastic to keep them fresh", "Stacking cases on the truck by color and room"],ans:0,exp:"Multiple cans of the 'same' color have minor batch variation. Boxing — pouring them all into a 5-gallon bucket and mixing — eliminates visible color shifts mid-wall."},
{q:"Stir-don't-shake applies to:",opts:["Most architectural paints", "Penetrating stains only", "Two-component products only", "Every coating, without exception"],ans:0,exp:"Shaking creates micro-bubbles that show up as pinholes and craters in the finish. Stick stirring is gentler. Mechanical paint shakers are OK at stores; in the field, stir gently."},
{q:"A bonding primer is BEST used:",opts:["On glossy or slick surfaces", "On masonry, and nowhere else", "On bare wood that will be stained", "Only under elastomeric coatings"],ans:0,exp:"Bonding primers grip slick surfaces — laminate, tile, glossy oil paint, fiberglass. The first coat in a system that converts a hostile substrate into a paintable one."},
{q:"A masonry primer should be:",opts:["Shellac-based", "An oil-based alkyd", "Standard interior latex", "Alkali-resistant"],ans:3,exp:"Fresh masonry has pH 12+. Alkyd binders saponify at high pH. Use alkali-resistant masonry primer (acrylic-based) until the substrate's pH drops below ~10 from age and weathering."},
{q:"A penetrating oil stain on a wood deck:",opts:["Cannot be reapplied once it weathers", "Wears away gradually instead of peeling", "Needs a separate primer underneath", "Forms a thick film that peels over time"],ans:1,exp:"Penetrating stains absorb into wood — no film to peel. They wear away gradually with sun and traffic. Re-coat every few years by cleaning and applying more — no scraping."},
{q:"Solid-color stain compared to penetrating stain:",opts:["Penetrates deeper into the wood fibers", "Contains no pigment, so the grain shows", "Never needs recoating once applied", "Forms a thin, paint-like film that can peel"],ans:3,exp:"Solid-color stain has heavy pigment + thin film. Looks like paint, but with deeper penetration. Can peel if applied over film-forming products or incompatible substrates."},
{q:"Silicone caulk:",opts:["Cannot be painted over", "Is the same as siliconized acrylic", "Cures fully in about 5 minutes", "Takes most paints once it cures"],ans:0,exp:"Pure silicone caulk is unpaintable. Common exam trap and field problem. Use silicone only where it stays exposed (kitchen, bath, glass-to-tile). For paintable trim joints, use siliconized acrylic or polyurethane."},
{q:"Siliconized acrylic caulk:",opts:["Is rated for interior use only", "Is the same as 100% silicone caulk", "Is paintable and works inside and out", "Cannot be painted once it cures"],ans:2,exp:"Siliconized acrylic = small amount of silicone added for flexibility/durability, but still paintable. Standard for trim caulk, interior and exterior. Don't confuse with 100% silicone."},
{q:"Polyurethane caulk is often preferred for:",opts:["Roofing seams and nothing else", "Glass-to-tile joints in showers", "Exterior joints with lots of movement", "Interior trim joints that get painted"],ans:2,exp:"Polyurethane caulk handles structural movement, lasts 20+ years, paintable after skin cure. Standard for exterior expansion joints, control joints, exterior insulation and finish system (EIFS) reveals."},
{q:"Setting-type joint compound (hot mud) compared to all-purpose joint compound:",opts:["Cures chemically and shrinks less", "Cannot be sanded once it hardens", "Dries softer than all-purpose", "Shrinks more as it dries"],ans:0,exp:"Hot mud cures by chemical reaction (45-min, 90-min versions). Harder, less shrinkage, faster recoat. Better for patches that need strength. All-purpose mud is easier to sand but weaker."},
{q:"A natural bristle brush is BEST used with:",opts:["Heavy texture coatings", "Oil-based paints and varnish", "Two-component epoxies", "Latex and acrylic interior paints"],ans:1,exp:"Natural bristles (China bristle) are absorbent. Water swells them and ruins the shape. Use natural bristle with oil/varnish/shellac. Use synthetic with latex."},
{q:"Synthetic bristle brushes are BEST used with:",opts:["Lacquers and shellac only", "Oil-based paints only", "Latex and acrylic paints", "Penetrating stains only"],ans:2,exp:"Synthetic (nylon, polyester, blends) holds shape in water. Standard for latex and acrylic. Quality blends can also work with solvent-borne products."},
{q:"A high-quality nylon/polyester blend brush is:",opts:["Made only for oil-based paints", "Meant to be thrown away after a single use", "Good with both latex and most oil paints", "Used only for applying stain"],ans:2,exp:"Quality blend brushes are the workhorses of the trade. Hold shape in water, handle solvents, last for years if cleaned properly. Worth the investment."},
{q:"An angled sash brush is designed for:",opts:["Spreading texture compound on ceilings", "Cutting in a clean line at trim and edges", "Covering large, flat wall areas as fast as possible", "Applying stain and nothing else"],ans:1,exp:"The angle on a sash brush lets you walk a clean line into corners and trim profiles. Standard for cutting in. Flat brushes handle larger areas more efficiently."},
{q:"When choosing a roller cover, the rule of thumb is:",opts:["Nap length makes no real difference", "Always use the thickest nap you can get for every job", "Match the nap length to the surface texture", "Always use the shortest nap available"],ans:2,exp:"Match nap to texture. Too short on rough = misses pinholes. Too long on smooth = stipples and orange peel. Pick the right nap and most application problems disappear."},
{q:"A 1/4\" nap roller cover is BEST for:",opts:["Doors, cabinets, and smooth metal", "Heavy exterior stucco and masonry walls", "Brick and split-face block", "Rough concrete block walls"],ans:0,exp:"Short nap (1/4\") leaves the smoothest finish on smooth substrates. Don't try to use it on textured surfaces — it skips the texture and leaves bare spots."},
{q:"A 3/8\" nap roller cover is BEST for:",opts:["Smooth drywall walls and ceilings", "Concrete block foundations", "Rough exterior stucco walls", "Heavy knockdown texture ceilings"],ans:0,exp:"3/8\" nap is the workhorse for interior walls — light texture, decent paint hold, smooth finish. Most painters use 3/8\" for ~80% of interior work."},
{q:"A 3/4\" to 1\" nap roller cover is BEST for:",opts:["Six-panel interior doors", "Fine cabinet, door, and trim work", "Smooth metal railings", "Rough stucco, block, and brick"],ans:3,exp:"Long nap reaches into texture. On rough stucco a thin nap leaves paint only on the high spots. Use 3/4\" or 1\" for stucco, masonry, and heavy textures."},
{q:"Foam roller covers tend to:",opts:["Work best on rough, textured walls", "Leave small pinholes in the finish", "Hold more paint than any nap roller", "Last for many years with care"],ans:1,exp:"Foam can leave tiny pinholes from trapped air. Fine for small smooth jobs and certain trim work. Not ideal for production or large walls."},
{q:"A natural wool (lambswool) roller cover is best with:",opts:["Caulks and sealants only", "Solvent-borne products on smooth surfaces", "Latex paints on rough surfaces", "Heavy texture coatings on rough stucco walls"],ans:1,exp:"Lambswool holds large amounts of solvent-borne paint and lays it down smoothly. Used for varnish, alkyd enamel, fine finish work. Synthetic covers for waterborne."},
{q:"Wood filler used for a paint-grade application should be:",opts:["Drywall joint compound", "Paintable wood filler", "Stainable wood filler", "Auto body filler only"],ans:1,exp:"Match filler to finish. Paintable filler bonds well and primes/paints uniformly. Stainable filler accepts stain. Drywall mud is too soft for wood — fails on movement."},
{q:"Lead-based paint disclosure requirements (federal Title X) apply to:",opts:["Sales and rentals of pre-1978 housing", "Commercial buildings of any age", "New homes built after 1978", "All real estate sales nationwide, any age"],ans:0,exp:"Title X disclosure: pre-1978 sale or rental requires disclosure of known lead-based paint or hazards. Different from lead-safe renovation rule (which governs renovation). Both apply to pre-1978 housing."},
{q:"A waterborne acrylic urethane hybrid is often used because:",opts:["Building codes require it on all trim", "It adds urethane toughness with low VOC", "It is the cheapest coating you can buy", "It dries far slower for better leveling"],ans:1,exp:"Waterborne urethane hybrids (and urethane-modified acrylics) deliver high-performance properties without the high VOC of solvent-borne urethane. Common in cabinet finishes and high-traffic floors."},
{q:"When tinting deep colors (deep base), the manufacturer's tinting guide must be followed because:",opts:["The guide is optional unless the paint is exterior", "All bases accept tint the same way", "Overloading tint can hurt dry time and durability", "Tint only changes the color, nothing else"],ans:2,exp:"Tint loads are limited per base. Overloading deep base tints can soften the film, slow dry, and reduce durability. Stay within the tinting guide's max ounces per gallon."},
{q:"The primary purpose of a primer/sealer on new drywall is:",opts:["To speed up drying of the topcoat", "To add a base color under the finish topcoat", "To even out porosity and prevent flashing", "To raise the paint's spread rate"],ans:2,exp:"New drywall has two surfaces with different porosity: paper face and dried joint compound. Topcoat absorbs differently into each, causing visible flashing. Polyvinyl acetate primer evens it out."},
{q:"A two-component urethane requires which type of respiratory protection during spray application:",opts:["Supplied-air respirator \u2014 isocyanates have no breakthrough indicator for cartridges", "Half-face air-purifying respirator (APR) with P100 (a filter removing 99.97 percent of particles, oil resistant)", "No respirator if outdoors", "Disposable N95 (a filter removing 95 percent of non-oil particles)"],ans:0,exp:"Isocyanates in two-component urethane are sensitizers \u2014 chronic exposure causes occupational asthma. APR cartridges have no end-of-service-life indicator for isocyanates. Supplied-air is required."},
{q:"A coating's technical data sheet (Technical Data Sheet) typically includes:",opts:["Mainly marketing claims and the color list", "Just the color formula and sheen name", "Prep, thinning, recoat times, and coverage", "The price and the store's return policy"],ans:2,exp:"Technical data sheet is the user manual for the coating. Read it before any unfamiliar product. Specs not on the can — surface prep, dry film thickness, recoat windows, environmental limits — all live on the technical data sheet."},
{q:"Alkyd paint applied over a fresh galvanized gutter will likely:",opts:["Adhere well for many years", "Cure faster than on bare steel", "Resist UV better than acrylic", "Saponify and lose adhesion"],ans:3,exp:"Classic saponification scenario. Zinc alkalinity + alkyd ester linkages = soap. The film softens, gets tacky, loses adhesion. Always use direct-to-metal acrylic or zinc-rich primer on galvanized."},
{q:"When painting a deep red or bright yellow exterior color, the painter should expect:",opts:["Lower VOC content than lighter colors", "The same UV durability as any other color", "Better hide and coverage in fewer coats", "Faster fading than neutrals or earth tones"],ans:3,exp:"Bright colors often use organic pigments which are UV-fugitive. Earth tones use inorganic pigments (iron oxides) which are very UV-stable. Set client expectations for vibrant colors on south/west exposures."},
{q:"A color is created by adding white to a hue. What is it called?",opts:["A shade","A tint","A tone","A chroma"],ans:1,exp:"Adding white produces a tint. Adding black produces a shade, and adding gray produces a tone."},
{q:"Two paint colors match perfectly under the store's fluorescent lighting but clearly differ in the customer's home. What is this phenomenon called?",opts:["Chalking","Metamerism","Saponification","Efflorescence"],ans:1,exp:"Metamerism is when two colors match under one light source and differ under another. Always evaluate color under the lighting the space actually uses."},
{q:"Colors that sit opposite each other on the color wheel are called:",opts:["Analogous","Complementary","Monochromatic","Triadic"],ans:1,exp:"Complementary colors sit opposite one another and give maximum contrast. Mixed together they neutralize each other toward gray or brown."},
{q:"A customer wants a small room to feel larger. Which color family generally helps?",opts:["Warm colors such as red and orange","Cool colors such as blue and green","Pure black","High-chroma yellow"],ans:1,exp:"Cool colors appear to recede, making a space read larger. Warm colors advance and make a room feel closer and smaller."},
{q:"Why do deep reds and bright yellows typically require more coats than a pastel color?",opts:["They dry more slowly between coats", "Their base has little white pigment to hide", "They are always thinner in viscosity", "They contain extra binder that lets light through"],ans:1,exp:"Deep and clear bases carry little white pigment so that they can accept heavy colorant. Less white pigment means far less hiding power."},
{q:"What is the most effective way to reduce the number of finish coats needed for a deep, saturated color?",opts:["Thin the paint before applying", "Use a gray-tinted primer underneath", "Apply the paint in colder weather", "Switch to a higher-sheen finish"],ans:1,exp:"A gray-tinted primer brings the starting value much closer to the finish color, dramatically cutting the number of topcoats required."},
{q:"A neutral beige reads distinctly pink once it is on the wall. What explains this?",opts:["The paint was mis-tinted","The color's undertone","Excessive sheen","Poor surface preparation"],ans:1,exp:"Undertone is the faint underlying hue inside a neutral. It becomes far more visible over a large area and is the usual reason a neutral looks wrong."},
{q:"How does sheen affect the way a color appears?",opts:["Higher sheen makes a color look lighter and duller", "Higher sheen makes a color read deeper", "Sheen has no effect on how a color looks", "Flat sheen makes every color look darker"],ans:1,exp:"Higher gloss reflects more light and makes the same color read deeper and more saturated. The identical color in flat and semi-gloss will not look the same."},
{q:"Which are the three primary colors?",opts:["Red, green, blue","Red, yellow, blue","Orange, green, violet","Cyan, magenta, yellow"],ans:1,exp:"In the traditional pigment color wheel the primaries are red, yellow, and blue. Mixing two primaries produces a secondary color."},
{q:"A customer picks a color from a small chip. What should you advise?",opts:["It will look identical on the wall", "It will look stronger on a full wall", "Chips always run two shades too light", "Chips are only accurate in flat sheen"],ans:1,exp:"Color intensifies over large areas. Choosing slightly lighter than the chip, and sampling on the actual wall, avoids a common disappointment."},
{q:"North-facing rooms receive what kind of natural light, and how does it affect color?",opts:["Warm light that intensifies warm colors","Cool, steady light that pushes colors bluer","Light that has no measurable effect","Intense light that fades color quickly"],ans:1,exp:"North light is cool and consistent, shifting colors toward blue. South-facing light is warm and strong, intensifying warm tones."},
{q:"What is the best way to confirm a color choice before committing to the whole job?",opts:["Compare two chips side by side in the store", "Paint a sample on the wall and view it all day", "Pick it from a printed catalog page", "Match it to a photo of the same color in a magazine"],ans:1,exp:"A sample on the actual wall, viewed under the room's real lighting at different times of day, is the only reliable check before committing."},
],
spray:[
{q:"The first digit of an airless spray tip number, when multiplied by 2, equals:",opts:["The tip's maximum pressure in thousands of PSI", "The fan width, in inches, at 12 inches away", "The orifice size in thousandths of an inch", "The viscosity range the tip can handle"],ans:1,exp:"Airless tip numbering: first digit × 2 = fan width in inches. A '5' makes a 10\" fan. The last two digits are the orifice in thousandths. Memorize this — it's tested almost every exam."},
{q:"The last two digits of an airless tip number indicate:",opts:["Recommended film thickness in mils", "Orifice size in thousandths of an inch", "Fan width in inches when held 12 inches away", "Maximum pressure in hundreds of PSI"],ans:1,exp:"Last two digits = orifice in thousandths. A 517 tip has a 0.017\" orifice. Larger orifice = heavier material flow. Match orifice to material viscosity."},
{q:"A 517 airless tip produces approximately:",opts:["10\" fan, 0.017\" orifice", "5\" fan, 0.017\" orifice", "5\" fan, 0.005\" orifice", "17\" fan, 0.005\" orifice"],ans:0,exp:"5 \u00d7 2 = 10\" fan width. Last two digits 17 = 0.017\" orifice. Standard size for interior latex on walls and ceilings."},
{q:"A 619 airless tip produces approximately:",opts:["19\" fan, 0.006\" orifice", "12\" fan, 0.019\" orifice", "6\" fan, 0.019\" orifice", "6\" fan, 0.009\" orifice"],ans:1,exp:"6 \u00d7 2 = 12\" fan width. Last two digits 19 = 0.019\" orifice. Common for exterior latex and primers on larger surfaces."},
{q:"A 415 airless tip produces approximately:",opts:["8\" fan, 0.015\" orifice", "4\" fan, 0.005\" orifice", "4\" fan, 0.015\" orifice", "15\" fan, 0.004\" orifice"],ans:0,exp:"4 \u00d7 2 = 8\" fan width. Last two digits 15 = 0.015\" orifice. Good middle-ground tip for primers and medium-body latex."},
{q:"A 213 airless tip produces approximately:",opts:["13\" fan, 0.002\" orifice", "2\" fan, 0.013\" orifice", "4\" fan, 0.013\" orifice", "4\" fan, 0.003\" orifice"],ans:2,exp:"2 \u00d7 2 = 4\" fan width. Last two digits 13 = 0.013\" orifice. Narrow fan for trim, doors, and cabinet work."},
{q:"For spraying heavy elastomeric or block filler, the appropriate tip orifice range is:",opts:["0.005\"–0.009\"", "0.021\"–0.031\"", "0.009\"–0.013\"", "0.013\"–0.017\""],ans:1,exp:"Heavy-bodied materials need large orifices. Block filler especially needs 0.025\"–0.031\" or larger. Smaller tips clog instantly and burn out the pump."},
{q:"For spraying lacquer or thin stains, the appropriate tip orifice range is:",opts:["0.025\"\u20130.031\"", "0.017\"\u20130.021\"", "0.035\"\u20130.045\"", "0.009\"\u20130.013\""],ans:3,exp:"Thin materials need small orifices for proper atomization. Larger orifices flood the surface with thin material producing runs and sags. Match orifice to viscosity."},
{q:"A worn airless tip will show in the spray pattern as:",opts:["A crisp, even oval with sharp, clean edges throughout", "Finer, more even atomization than a new tip", "Tails at the edges and a fan that won't open", "No visible change in the spray pattern"],ans:2,exp:"Worn tip = orifice has eroded oval. Material no longer atomizes evenly across the fan. Replace the tip — increasing pressure to compensate just wastes paint and accelerates pump wear."},
{q:"Recommended airless gun-to-substrate distance is:",opts:["36 inches", "4 inches", "12 inches", "24 inches"],ans:2,exp:"12\" is standard for airless. Closer = sags and runs from too much material. Farther = dry spray, poor coverage, lower transfer efficiency. Maintain consistent distance throughout each pass."},
{q:"Holding the airless gun too close to the substrate will result in:",opts:["Sags, runs, and excessive film build", "No change, as long as speed is constant", "Less material reaching the surface", "Thin coverage with poor hide"],ans:0,exp:"Too close concentrates material in a small area. Film thickness exceeds what gravity can hold = sags, runs, curtains. Back off to 12\" and adjust speed instead."},
{q:"Holding the airless gun too far from the substrate will result in:",opts:["Sharper, cleaner edges on the fan", "Sags and runs from heavy film", "Dry spray and wasted material", "Heavier film build per pass"],ans:2,exp:"At distance, solvents flash before material lands — dry overspray hits as dust. Wastes paint, leaves rough finish, and reduces hide. Stay at 12\"."},
{q:"The recommended overlap between spray passes is approximately:",opts:["50%", "0%", "100%", "25%"],ans:0,exp:"50% overlap = each pass covers half the previous. Produces uniform film build. Less overlap leaves stripes; more overlap doubles film build (sags) and wastes paint."},
{q:"Cross-coating (cross-hatching) when spraying is:",opts:["Marking the wall in a grid before spraying", "Spraying two colors in alternating passes", "One vertical pass, then one horizontal pass", "Spraying in one direction only, top to bottom"],ans:2,exp:"Cross-coating builds even film by covering each direction's gaps with the perpendicular pass. Standard for fine finishes — cabinets, doors, industrial coatings."},
{q:"Pulling the trigger BEFORE moving the gun and releasing AFTER stopping causes:",opts:["Better atomization at the edges of the wall", "Lower material use on each pass", "Even film build from end to end", "Heavy buildup at the start and stop points"],ans:3,exp:"Trigger discipline: start moving FIRST, then trigger. Release trigger BEFORE stopping. This prevents the gun from depositing extra material at start/stop points."},
{q:"Tilting the gun upward or downward instead of holding perpendicular to the surface results in:",opts:["An even film across the whole fan", "Better coverage on textured walls", "Faster work with no real change in film quality", "Heavy on the near side, dry on the far side"],ans:3,exp:"Tilting changes the distance from gun to substrate across the fan. Closer side gets more material, farther side gets less. Hold perpendicular and move parallel to the wall."},
{q:"HVLP (High Volume Low Pressure) spray equipment is preferred when:",opts:["Spraying heavy block filler on masonry walls", "Working outdoors in high winds", "Maximum production speed is the goal", "Fine finish and low overspray are the priority"],ans:3,exp:"HVLP = fine atomization, high transfer efficiency (~65%+), less overspray. Standard for cabinets, fine finish, automotive-style work. Slower than airless on production work."},
{q:"High volume, low pressure (HVLP) spray transfer efficiency is approximately:",opts:["95%", "40%", "25%", "65%"],ans:3,exp:"HVLP transfer efficiency typically 65%+ vs airless ~40-50%. Less paint wasted as overspray. Required by some California air districts for compliance with volatile organic compound (VOC) and emissions rules."},
{q:"Conventional air spray transfer efficiency is approximately:",opts:["45–55%", "90–95%", "25–35%", "70–80%"],ans:2,exp:"Conventional air spray = lowest transfer efficiency, highest overspray. Used for very fine atomization on automotive or specialty industrial finish. Largely replaced by high volume, low pressure (HVLP) for environmental reasons."},
{q:"Airless spray transfer efficiency is typically approximately:",opts:["40–50%", "75–85%", "10–20%", "90–99%"],ans:0,exp:"Airless ~40-50% transfer efficiency. Faster than high volume, low pressure (HVLP) but more overspray. Production tool for walls, ceilings, exteriors. HVLP for fine finish where transfer efficiency matters."},
{q:"'Back-rolling' after spraying exterior siding primarily:",opts:["Works the coating into porous surfaces", "Builds film past the manufacturer's spec", "Removes excess material from the surface", "Shortens the dry time between coats"],ans:0,exp:"Spray applies coating to the surface; back-rolling works it into the wood/stucco pores. Critical for first coats on porous exterior. Without it, coating sits on top and peels."},
{q:"Spray pressure should be set to:",opts:["A fixed 500 PSI for every material", "The lowest pressure that fully atomizes", "The highest pressure the equipment can produce", "A fixed 3,500 PSI for every material"],ans:1,exp:"Lowest pressure that atomizes properly. Higher pressure = more overspray, faster tip wear, more wasted paint. Start at manufacturer's recommended pressure for the tip and adjust if needed."},
{q:"A spray pattern that shows runs and sags despite proper distance and pressure indicates:",opts:["Nothing; some runs are normal with airless", "A failing pump motor on the sprayer", "Pressure that is set too low", "Overthinned paint or too slow a pass"],ans:3,exp:"Runs at correct distance/pressure usually mean the material has been thinned too much, or the painter is moving too slowly. Re-check viscosity and speed up the passes."},
{q:"Fish eyes (small craters) in a sprayed coating are MOST commonly caused by:",opts:["A cold substrate during application", "Silicone, oil, or wax on the surface", "A spray tip that is too small", "Too much overlap between spray passes"],ans:1,exp:"Fish eyes = the coating refuses to wet over a contaminated spot. Silicone is the #1 culprit (furniture polish, mold release, lubricants). Wipe with appropriate solvent, or use a fish-eye eliminator."},
{q:"Orange peel texture in a sprayed coating can be caused by:",opts:["Moisture trapped in the film as it cures", "Too little overlap between passes", "Too far, too much pressure, or wrong viscosity", "Primer that was not sanded first"],ans:2,exp:"Orange peel = material not flowing out before drying. Too far away, too high pressure, viscosity too high, dry environment. Bring gun closer, lower pressure, check thinning."},
{q:"A spitting spray gun (intermittent paint discharge) usually indicates:",opts:["A worn tip that needs replacing", "Air in the line or a loose fitting", "A pump motor that is too powerful", "Normal operation; the coating is fine"],ans:1,exp:"Spitting = air in the fluid stream. Bleed the system, check pump packings, tighten fittings, clean filters. Can also indicate empty paint container — pump drawing air."},
{q:"Dry spray (overspray particles landing on the surface as dust) is caused by:",opts:["Too much distance or pressure", "Holding the gun too close", "Pressure set too low for the tip", "A cold, damp substrate"],ans:0,exp:"Dry spray = solvent flashes before paint reaches surface. Caused by distance, high pressure, hot/dry environment. Bring gun closer, lower pressure, work earlier in the day if hot."},
{q:"Airless equipment can inject paint through skin and into tissue, causing:",opts:["A minor bruise that heals on its own", "A temporary stain that washes off", "A small cut that only needs a bandage", "A serious injury needing emergency care now"],ans:3,exp:"Airless injection injuries are catastrophic. Pressure forces paint deep into tissue causing chemical burns, infection, compartment syndrome. Looks like a small puncture. Go to ER immediately — bring the safety data sheet (SDS)."},
{q:"When operating an airless sprayer, the painter should ALWAYS:",opts:["Use the tip guard and trigger lock", "Disable the trigger lock for faster work", "Test the pattern by spraying onto clothing", "Leave the safety off between passes"],ans:0,exp:"Tip guard prevents finger contact with the spray tip. Trigger lock prevents accidental discharge. Never aim at anyone — including yourself. These are basic, non-negotiable safety practices."},
{q:"A respirator IS required during:",opts:["All spray work, including waterborne", "Solvent-based spray work, but not latex", "Indoor spraying, but not outdoor work", "Any job where you work alone"],ans:0,exp:"Atomized paint particles are small enough to reach deep lung tissue regardless of binder type. Even waterborne paints contain pigments and additives that shouldn't be inhaled. Always wear a respirator when spraying."},
{q:"Spray pressure for most architectural latex with .015\u2013.019 tips is typically in the range of:",opts:["1,500\u20132,500 PSI", "100\u2013300 PSI", "500\u2013800 PSI", "4,000\u20135,000 PSI"],ans:0,exp:"1,500\u20132,500 PSI is the typical airless range for architectural latex. Lower for stains/light material; higher for heavy elastomeric. Start at the manufacturer's tip recommendation."},
{q:"A 'fan' pattern shaped like an hourglass (heavy at top and bottom, thin in the middle) indicates:",opts:["Material that is thinned too much", "A perfect pattern for most paints", "A partly clogged or unevenly worn tip", "Paint that has warmed up in the sun"],ans:2,exp:"Hourglass pattern = the orifice is partially obstructed or eroded asymmetrically. Reverse the tip to clear, or replace if worn. Don't try to compensate with pressure."},
{q:"Reversible spray tips allow:",opts:["Faster cleanup at the end of the day", "Clearing clogs by flipping the tip", "Switching colors without flushing", "Changing pressure without a new tip"],ans:1,exp:"Reverse-clean tips can be flipped 180° to blow a clog out the back of the orifice. Standard on modern airless guns. Saves time vs. removing and disassembling the tip."},
{q:"When transitioning from one color to another in airless spraying, the painter should:",opts:["Let the two colors mix in the line", "Spray the old color until the new one appears", "Reuse the hose without any cleaning", "Flush the system clean before the new color"],ans:3,exp:"Color contamination shows up as streaks during the new color application. Flush with water (waterborne) or solvent (alkyd) until the system runs clean. Then introduce the new color."},
{q:"A 5-gallon airless paint pump can typically deliver approximately:",opts:["0.05–0.1 gallons per minute", "0.5–1.5 gallons per minute", "40–50 gallons per minute", "8–10 gallons per minute"],ans:1,exp:"Pump output varies by model. Mid-size contractor pumps deliver around 0.5-1.5 GPM. Large industrial pumps go higher. Tip size determines actual material flow at any given pressure."},
{q:"When spraying an interior wall, the painter should plan to:",opts:["Keep a wet edge to avoid lap marks", "Start wherever and fill in gaps later", "Spray a small area, then stop and wait", "Spray top to bottom only, never bottom up"],ans:0,exp:"Wet edge = paint at the leading edge is still wet when the next pass blends in. Stopping mid-wall lets the edge dry, creating a visible line when the next section is sprayed."},
{q:"When spraying ceilings, additional precautions include:",opts:["Full eye protection and covering the floor", "No extra steps beyond a wall job", "Thinning the paint so less of it falls", "Moving every piece of furniture out of the home"],ans:0,exp:"Ceiling overspray comes straight down — directly in your eyes without protection. Full-face protection is essential. Plus mask/cover the floor for the inevitable drift."},
{q:"Spraying outdoors on a windy day:",opts:["Is fine in any wind if you stand upwind", "Improves atomization and speeds drying", "Is fine up to about 25–30 mph", "Should be avoided above about 10–15 mph"],ans:3,exp:"Wind blows overspray onto neighboring property (cars, vegetation) and disrupts the spray pattern. Above ~10-15 mph, switch to brush/roll or wait for calmer conditions."},
{q:"A fluid filter on an airless pump should be:",opts:["Used only on industrial coatings", "Cleaned regularly to prevent clogs", "Cleaned about once a year at tune-up", "Removed for faster material flow"],ans:1,exp:"Filters protect the tip from debris and pump pulsation from clogged orifices. Clean daily on production work. Removing filters voids most warranties and increases tip wear dramatically."},
{q:"A pressure relief valve on an airless pump should be:",opts:["Locked closed so pressure stays steady", "Used to bleed pressure before any service", "Used only when the pump is broken", "Removed to allow higher spray pressure"],ans:1,exp:"The pressure relief valve (PRV) bleeds the system safely. Always relieve pressure before disassembling anything — pressurized paint can inject through skin or shoot fittings off. Standard daily safety practice."},
{q:"Static electricity hazards during spray application are MOST relevant when:",opts:["Spraying waterborne coatings", "Working outdoors in dry air", "Never; static isn't a painting concern", "Spraying solvent-borne coatings"],ans:3,exp:"Solvent vapors + static spark = explosion. Ground the work, the painter, and the equipment when spraying solvent-borne. Bond conductive containers together. This is a real fire hazard, not theoretical."},
{q:"The PRIMARY benefit of airless over conventional air spray is:",opts:["Lower equipment cost than any other rig", "Faster production and heavier materials", "Finer atomization of thin coatings", "Less overspray than any other method"],ans:1,exp:"Airless = production. Heavy viscosity, fast coverage, no compressor needed. Conventional air spray = fine atomization but slower and inefficient for production architectural work."},
{q:"A new airless tip should:",opts:["Be installed straight from the package", "Be warmed before its first use", "Soak in mineral spirits overnight", "Be checked for size and a proper guard"],ans:3,exp:"Verify the tip is the correct size for the material and that the guard is properly installed. Wrong tip size = wrong fan and atomization. Missing guard = injection injury risk."},
{q:"When changing tips on an airless gun, the painter must FIRST:",opts:["Lock the trigger and relieve pressure", "Unplug the pump and leave it pressurized", "Keep spraying to clear the line", "Tighten the tip with pliers"],ans:0,exp:"Lock the trigger and bleed pressure first. Pressurized paint will inject through skin or send fittings flying. This sequence prevents the most common airless injury cause."},
{q:"A common interior application sequence using high volume, low pressure (HVLP) for cabinets is:",opts:["Three heavy coats with no sanding between", "One heavy, wet topcoat with no primer", "Topcoat first, then sand and prime over it", "Primer, light sand, then light topcoat passes"],ans:3,exp:"Cabinet finish = primer/sealer, sand smooth, build topcoat in light passes. HVLP atomizes finely; allow each pass to flash. Sand between coats with very fine grit (320+) for smoothness."},
{q:"When spraying primer that will be topcoated, the painter should:",opts:["Apply it as heavily as the gun allows", "Topcoat it immediately without waiting", "Skip it if the topcoat is high quality", "Hit the specified thickness and recoat in time"],ans:3,exp:"Primer's job: adhesion + sealing + mil thickness per spec. Apply at recommended dry film thickness, dry per technical data sheet, topcoat in window. Heavy primer can crack; thin primer doesn't seal."},
{q:"Cleaning an airless pump at the end of the day for waterborne coatings:",opts:["Done with mineral spirits, then water", "Not needed if it's used again tomorrow", "Done with clean water until it runs clear", "Done with lacquer thinner until clear"],ans:2,exp:"Waterborne = water cleanup. Run clean water through until discharge is clear. Pump preserver protects the seals from drying out during long storage. Daily flush prevents clogs and saves equipment."},
{q:"Cleaning an airless pump after spraying alkyd or oil-based coatings:",opts:["Bleach diluted with warm water", "Mineral spirits or the specified solvent", "Nothing, if it's used again within a week", "Plenty of clean water until clear"],ans:1,exp:"Alkyd doesn't clean up with water. Use mineral spirits, then store with pump preserver if waiting more than a day. Switching solvents (e.g., to lacquer thinner) requires checking compatibility with packings."},
{q:"Spraying around windows, doors, and trim:",opts:["Calls for flat brushes, never a sprayer", "Requires removing all of the glass first", "Needs no masking if you spray carefully", "Requires careful masking with tape and plastic"],ans:3,exp:"Masking is non-negotiable for spray work. Tape and plastic/paper protect glass, hardware, fixtures, and adjacent surfaces. Sloppy masking = costly cleanup and angry customers."},
{q:"When the spray pattern shows tails (fingers at the edges) at proper pressure, the FIRST troubleshooting step is to:",opts:["Move the gun farther away from the surface", "Replace the pump's motor brushes", "Thin the paint with a little water", "Inspect the tip for wear and replace if worn"],ans:3,exp:"Tails are the textbook symptom of a worn tip. The orifice has elongated from abrasion. Replace the tip — don't crank up the pressure to compensate, that just wastes paint and accelerates pump damage."}
],
brush_roller:[
{q:"Cutting in is:",opts:["Cutting drywall to fit around outlets", "Scraping dried paint off glass with a blade", "Brushing the edges before rolling", "Trimming a roller cover down to size"],ans:2,exp:"Cutting in = brushing the perimeter before rolling. Roller can't reach corners and edges cleanly. Brush feathers a clean line; roller fills the field. Always cut in while planning to roll into the wet edge."},
{q:"A wet edge during brushing or rolling means:",opts:["The wall was misted with water before painting", "The paint can has been left open to the air", "The brush is damp from cleaning before use", "The working edge stays wet so sections blend"],ans:3,exp:"Wet edge = the working edge of fresh paint hasn't dried yet. New paint blends into it seamlessly. If it dries first, you get a visible lap mark when you paint over it."},
{q:"Lap marks appear in the finished paint when:",opts:["The roller nap is too long for the wall", "One section dries before the next is blended", "The brush is too small for the area", "The paint was stirred too long before it was used"],ans:1,exp:"Lap marks = telltale stripes where dried paint meets new wet paint. Fix by working faster, smaller sections, and not stopping mid-wall. Common in hot/dry conditions."},
{q:"When rolling a wall, the painter should generally:",opts:["Roll in one direction only, top to bottom", "Cut in the whole room, then roll the next day", "Cut in a section, then roll it while still wet", "Roll the walls first, then cut in last"],ans:2,exp:"Cutting in then rolling into the wet cut-in produces a seamless blend. Cut in the entire room first and the brushwork dries — when you roll up to it, you get a visible 'picture frame' band."},
{q:"Loading a brush should fill approximately:",opts:["1/3 of the bristle length", "About half of the bristle length", "The full bristle length", "Just the very tips"],ans:0,exp:"1/3 load is the sweet spot — enough paint to work, not so much it drips. Tap (don't wipe) the excess off on the inside of the can. Wiping wastes paint and drips down the can side."},
{q:"'Tipping off' with a brush means:",opts:["Throwing out a brush once the tip wears", "Cleaning the tip of the brush between coats", "Light final strokes to smooth out brush marks", "Dipping only the tip of the brush in paint"],ans:2,exp:"Lay paint on with several strokes, then 'tip off' with light final strokes in one direction (typically with the grain on wood). Eliminates brush marks for a smooth finish."},
{q:"When painting doors with a brush, brush strokes should generally:",opts:["Be made in small circles for even coverage", "Go in whatever direction covers fastest", "Follow the grain in a consistent pattern", "Run horizontally across the whole door"],ans:2,exp:"Doors need a consistent stroke pattern. On panel doors: panels first, then rails (horizontal), then stiles (vertical). Tip off in the direction of the grain or wood length."},
{q:"A foam roller cover is BEST used for:",opts:["Rough exterior surfaces", "Heavy exterior stucco", "Concrete block walls", "Small, smooth surfaces"],ans:3,exp:"Foam covers are smooth-finish tools for small jobs and trim. Tend to leave tiny pinholes from trapped air. Fine for cabinets and doors; not for walls."},
{q:"Rolling a wall in a 'W' or 'M' pattern then filling in:",opts:["Causes lap marks on most walls", "Should never be done on walls", "Spreads the roller load evenly", "Wastes paint compared to straight strokes"],ans:2,exp:"Classic W or M technique: lay down the roller load in a zigzag, then fill in without reloading. Distributes paint evenly. Then lay off in one direction for the finish."},
{q:"Rolling pressure should be:",opts:["Light, letting the cover release the paint", "Varied randomly from stroke to stroke", "Heavy, to push more paint onto the wall", "Hard enough to flatten the nap completely"],ans:0,exp:"Light pressure. The roller releases the paint it's holding regardless of pressure. Hard pressure squeezes paint out of the cover unevenly and creates streaks and roller marks."},
{q:"When cutting in around a ceiling line, the painter typically:",opts:["Sprays the line with a small airless tip", "Tapes the ceiling and rolls right up to it", "Feathers a 2–3 inch line with an angled brush", "Rolls the corner with a standard 9-inch roller"],ans:2,exp:"An angled sash brush walks the line cleanly. Cut in 2-3\" wide so the roller can reach into the cut-in without hitting the ceiling. Skilled painters cut in freehand faster than taping."},
{q:"Brushes should be cleaned:",opts:["The next morning, before starting work", "At the end of the week, all at once", "Only when the bristles start to stiffen", "Right after use, before the paint hardens"],ans:3,exp:"Dried paint kills brushes. Quality brushes ($20-30) clean up perfectly when done immediately, or require replacement when neglected. Five minutes of cleanup beats $30 in lost brushes."},
